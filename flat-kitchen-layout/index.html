<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>② 坂下一丁目 厨房レイアウト</title>

<!-- PWA / 「アプリ化」用タグ(2026-10-22追加) — ホーム画面に追加して単独起動すると、
     ブラウザのアドレスバー/検索窓なしの全画面表示になり、画面をより広く使える。
     iOS Safariはmanifest.jsonを見ないため、apple-mobile-web-app-*系のタグで個別に対応。 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B85042">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="厨房レイアウト">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#FBF9F6; --paper-raised:#FFFFFF; --paper-sunk:#F2EEE7;
    --ink:#2B1B14; --ink-soft:#73635A; --ink-faint:#9C9087;
    --line:#E2DBD0; --line-strong:#C9C0B2;
    --accent:#B85042; --accent-soft:#F3E1DC;

    --cold-fill:#E1E9F0; --cold-line:#4C6E90;
    --prod-fill:#F3E1DC; --prod-line:#B85042;
    --pack-fill:#E4ECE3; --pack-line:#5C7D63;
    --sup-fill:#F1E9DD; --sup-line:#8A7B6C;
    --util-fill:#E3EEEC; --util-line:#3E7C74;
    --notch-fill:#DCD7CF; --notch-line:#6B6358;
    --person-fill:#E7E4F2; --person-line:#675F92;
    --pillar-fill:#C7C3BA; --pillar-line:#4E4A42;
    --wall-fill:#C9CDD3; --wall-line:#48525C;
    --door-fill:#EDDFC2; --door-line:#9C7A3C;

    --badge-fill:#2B1B14; --badge-text:#FBF9F6;

    --status-confirmed:#5C7D63; --status-confirmed-bg:#E4ECE3;
    --status-estimate:#B85042; --status-estimate-bg:#F3E1DC;
    --status-new:#3E7C74; --status-new-bg:#E3EEEC;
    --status-ref:#675F92; --status-ref-bg:#E7E4F2;
    --status-approx:#9A6B21; --status-approx-bg:#F0E3C6;
    --doryoku:#2B5FA3; --doryoku-bg:#E1EAF5;

    --shadow: 0 1px 2px rgba(43,27,20,.06), 0 6px 20px -8px rgba(43,27,20,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1613; --paper-raised:#241D19; --paper-sunk:#17120F;
      --ink:#F2E9E1; --ink-soft:#C3B4A8; --ink-faint:#8B7C70;
      --line:#352B24; --line-strong:#4A3D33;
      --accent:#E2917E; --accent-soft:#3A2722;

      --cold-fill:#1F2C38; --cold-line:#8FB3D8;
      --prod-fill:#332420; --prod-line:#E2917E;
      --pack-fill:#1E2820; --pack-line:#93C49F;
      --sup-fill:#2A231C; --sup-line:#C7B39B;
      --util-fill:#16302C; --util-line:#79CBBE;
      --notch-fill:#332C24; --notch-line:#A89A89;
      --person-fill:#2A273A; --person-line:#B6AEDC;
      --pillar-fill:#433F39; --pillar-line:#AFA99D;
      --wall-fill:#3A3F46; --wall-line:#A9B1B9;
      --door-fill:#332A1C; --door-line:#D9BB7A;

      --badge-fill:#F2E9E1; --badge-text:#1C1613;

      --status-confirmed:#93C49F; --status-confirmed-bg:#1E2820;
      --status-estimate:#E2917E; --status-estimate-bg:#3A2722;
      --status-new:#79CBBE; --status-new-bg:#16302C;
      --status-ref:#B6AEDC; --status-ref-bg:#2A273A;
      --status-approx:#E0B978; --status-approx-bg:#3A2E18;
      --doryoku:#7FADE0; --doryoku-bg:#1C2E42;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1613; --paper-raised:#241D19; --paper-sunk:#17120F;
    --ink:#F2E9E1; --ink-soft:#C3B4A8; --ink-faint:#8B7C70;
    --line:#352B24; --line-strong:#4A3D33;
    --accent:#E2917E; --accent-soft:#3A2722;
    --cold-fill:#1F2C38; --cold-line:#8FB3D8;
    --prod-fill:#332420; --prod-line:#E2917E;
    --pack-fill:#1E2820; --pack-line:#93C49F;
    --sup-fill:#2A231C; --sup-line:#C7B39B;
    --util-fill:#16302C; --util-line:#79CBBE;
    --notch-fill:#332C24; --notch-line:#A89A89;
    --person-fill:#2A273A; --person-line:#B6AEDC;
    --pillar-fill:#433F39; --pillar-line:#AFA99D;
    --wall-fill:#3A3F46; --wall-line:#A9B1B9;
    --door-fill:#332A1C; --door-line:#D9BB7A;
    --badge-fill:#F2E9E1; --badge-text:#1C1613;
    --status-confirmed:#93C49F; --status-confirmed-bg:#1E2820;
    --status-estimate:#E2917E; --status-estimate-bg:#3A2722;
    --status-new:#79CBBE; --status-new-bg:#16302C;
    --status-ref:#B6AEDC; --status-ref-bg:#2A273A;
    --status-approx:#E0B978; --status-approx-bg:#3A2E18;
    --doryoku:#7FADE0; --doryoku-bg:#1C2E42;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}

  .page{
    max-width:1040px;
    margin:0 auto;
    /* env(safe-area-inset-*) keeps content clear of notches/home-indicators when
       launched as an installed standalone app (viewport-fit=cover) — falls back to
       the plain 16px/28px/64px values on ordinary browsers where the env() is 0. */
    padding:28px max(16px, env(safe-area-inset-right)) max(64px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    padding-top:max(28px, env(safe-area-inset-top));
  }

  header{padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .eyebrow{
    margin:0 0 6px; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); font-weight:700;
  }
  h1{margin:0 0 10px; font-size:clamp(22px,4vw,30px); font-weight:800; letter-spacing:-.01em; text-wrap:balance;}
  .subtitle{margin:0 0 18px; color:var(--ink-soft); font-size:14.5px; line-height:1.7; max-width:68ch;}

  .caution{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius:10px; padding:11px 14px; margin:0 0 20px; font-size:13.5px; line-height:1.6; color:var(--ink);
  }
  .caution b{color:var(--accent);}

  .tabs{display:flex; gap:6px; background:var(--paper-sunk); padding:4px; border-radius:11px; width:fit-content;}
  .tab{
    appearance:none; border:none; background:transparent; color:var(--ink-soft);
    font:inherit; font-weight:600; font-size:13.5px; padding:9px 18px; border-radius:8px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow);}
  .tab:hover:not(.active){color:var(--ink);}

  .view{display:none; margin-top:22px;}
  .view.active{display:block;}

  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .panel-head h2{margin:0; font-size:16px; font-weight:700;}
  .panel-head .hint{font-size:12.5px; color:var(--ink-faint);}
  .head-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .reset-btn{
    appearance:none; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft);
    font:inherit; font-weight:600; font-size:12px; padding:6px 12px; border-radius:7px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .reset-btn:hover{border-color:var(--accent); color:var(--accent);}
  .drag-note{margin-top:10px;}

  .svg-wrap{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    padding:18px; overflow-x:auto; box-shadow:var(--shadow); overscroll-behavior:contain;
  }
  .svg-wrap svg{display:block; min-width:640px; width:100%; height:auto;}
  .equip-group{cursor:grab; touch-action:none;}
  .equip-group:active, .equip-group.dragging{cursor:grabbing;}
  .equip-group.equip-fixed{cursor:default;}
  .equip-group.dragging .equip-rect{stroke-width:2.4;}
  .rotate-btn{cursor:pointer; touch-action:none;}
  .rotate-btn:hover circle{stroke:var(--accent);}
  .zone-rect{cursor:grab; touch-action:none;}
  .zone-rect:active, .zone-rect.dragging{cursor:grabbing;}
  .zone-rect.dragging{stroke-width:2.2;}
  .zone-resize-handle{cursor:nwse-resize; touch-action:none;}
  .zone-resize-handle:hover{opacity:1 !important;}
  .wall-paint-capture{touch-action:none;}
  .equip3d-group{cursor:default;}

  .eq-tooltip{
    position:fixed; z-index:80; pointer-events:none; left:0; top:0;
    background:var(--ink); color:var(--paper); max-width:240px;
    font-size:12px; line-height:1.55; padding:9px 12px; border-radius:9px; box-shadow:var(--shadow);
    opacity:0; transform:translateY(3px); transition:opacity .1s ease, transform .1s ease;
  }
  .eq-tooltip.show{opacity:1; transform:translateY(0);}
  .eq-tooltip .tt-name{display:block; font-weight:700; font-size:12.5px; margin-bottom:4px;}
  .eq-tooltip .tt-dim{display:block; font-family:"IBM Plex Mono",monospace; font-size:11.5px; opacity:.82;}
  .eq-tooltip .tt-row{margin-top:4px; opacity:.82; font-size:11.5px;}

  /* Tap-to-show info sheet — the touch-friendly counterpart to the hover
     tooltip above. A phone has no hover state, so tapping an equipment
     block (without dragging it) slides this up from the bottom instead. */
  .eq-infosheet{
    position:fixed; left:0; right:0; bottom:0; z-index:90; max-width:480px; margin:0 auto;
    background:var(--paper-raised); border:1px solid var(--line); border-bottom:none;
    border-radius:16px 16px 0 0; box-shadow:0 -8px 28px -10px rgba(43,27,20,.3);
    padding:16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    transform:translateY(110%); transition:transform .2s ease;
  }
  .eq-infosheet.show{transform:translateY(0);}
  .eq-infosheet .is-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
  .eq-infosheet .is-name{font-weight:700; font-size:14.5px; color:var(--ink); line-height:1.4;}
  .eq-infosheet .is-close{
    appearance:none; border:none; background:var(--paper-sunk); color:var(--ink-soft);
    width:26px; height:26px; border-radius:50%; font-size:13px; line-height:1; cursor:pointer; flex:none;
  }
  .eq-infosheet .is-dim{margin-top:6px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-soft);}
  .eq-infosheet .is-row{margin-top:5px; font-size:12.5px; color:var(--ink-soft);}

  .iso-wrap{
    background:#F4EFE7; border:1px solid var(--line); border-radius:14px;
    padding:18px; overflow-x:auto; box-shadow:var(--shadow);
    cursor:grab; touch-action:none; overscroll-behavior:contain;
  }
  .iso-wrap.dragging{cursor:grabbing;}
  .iso-wrap svg{display:block; min-width:640px; width:100%; height:auto;}

  .iso-rotate-group{display:flex; align-items:center; gap:6px;}
  .iso-rotate-btn{font-size:15px; font-weight:700; padding:5px 11px; line-height:1;}

  .wall-tool-group{display:flex; align-items:center; gap:6px;}
  .wall-tool-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .wall-tool-btn.active:hover{color:#fff;}
  .clearance-tool-group{display:flex; align-items:center; gap:6px;}
  .clearance-tool-group .wall-tool-btn.active{background:var(--status-estimate); border-color:var(--status-estimate);}

  .undo-tool-group{display:flex; align-items:center; gap:6px;}
  .undo-tool-group .reset-btn[disabled]{opacity:.5; cursor:default; pointer-events:none;}
  .clearance-threshold{
    appearance:none; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft);
    font:inherit; font-weight:600; font-size:12px; padding:6px 10px; border-radius:7px; cursor:pointer;
  }

  .legend-row{
    display:flex; flex-wrap:wrap; gap:8px 18px; margin:16px 2px; font-size:12.5px; color:var(--ink-soft);
  }
  .legend-item{display:flex; align-items:center; gap:7px;}
  .swatch{width:13px; height:13px; border-radius:3px; border:1.4px solid; flex:none;}
  .legend-icon{width:15px; height:15px; color:var(--ink-soft); flex:none;}

  .kw-summary{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 14px;
    background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius:12px; padding:13px 16px; margin:14px 0 0; box-shadow:var(--shadow);
  }
  .kw-summary .ks-label{font-size:12.5px; font-weight:700; color:var(--ink); letter-spacing:.01em;}
  .kw-summary .ks-value{font-family:"IBM Plex Mono",monospace; font-size:21px; font-weight:700; color:var(--accent); white-space:nowrap;}
  .table-wrap{
    margin-top:18px; background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow);
  }
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; min-width:760px; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line);
    background:var(--paper-sunk); white-space:nowrap;
  }
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-sunk);}
  /* 動力(三相200V)が必要な見込みの機器の行 — 左の縦線+薄い背景で、スクロールしても
     容量(kW)列まで見なくても一目で分かるようにする(容量列自体の数値も青くする) */
  tr.row-doryoku td{background:var(--doryoku-bg);}
  tr.row-doryoku:hover td{background:var(--doryoku-bg); filter:brightness(0.96);}
  tr.row-doryoku td:first-child{box-shadow:inset 3px 0 0 var(--doryoku);}
  td.num{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  td.num.kw-doryoku{color:var(--doryoku); font-weight:700;}
  .badge-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; background:var(--badge-fill); color:var(--badge-text);
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:600; flex:none;
  }
  .zone-pill{font-size:11.5px; color:var(--ink-soft);}
  .pill{
    display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700;
  }
  .pill.confirmed{background:var(--status-confirmed-bg); color:var(--status-confirmed);}
  .pill.estimate{background:var(--status-estimate-bg); color:var(--status-estimate);}
  .pill.new{background:var(--status-new-bg); color:var(--status-new);}
  .pill.ref{background:var(--status-ref-bg); color:var(--status-ref);}
  .pill.approx{background:var(--status-approx-bg); color:var(--status-approx);}
  .util-icons{display:flex; gap:6px;}
  .util-icons svg{width:15px; height:15px; color:var(--ink-soft);}

  tfoot .total-row td{
    padding:11px 12px; border-top:2px solid var(--line-strong); border-bottom:none;
    font-weight:700; background:var(--paper-sunk);
  }
  tfoot .total-row td:first-child{text-align:right; color:var(--ink-soft); font-weight:600;}
  tfoot .total-row td.num{color:var(--accent); font-size:14px;}
  .action-cell{white-space:nowrap;}
  .action-btn{
    appearance:none; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft);
    font:inherit; font-weight:600; font-size:11px; padding:5px 9px; border-radius:6px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease; white-space:nowrap;
  }
  .action-btn:hover{border-color:var(--accent); color:var(--accent);}
  .action-btn.del-btn{margin-left:6px;}
  .action-btn.del-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* Custom equipment add form — a centered modal (not the bottom sheet used for
     tap-info) since this has several fields and benefits from more room on screen */
  .custom-eq-trigger-row{margin:4px 0 14px;}
  .custom-eq-trigger{font-weight:700;}
  .custom-eq-overlay{
    position:fixed; inset:0; z-index:95; background:rgba(26,18,13,.42);
    display:none; align-items:center; justify-content:center; padding:18px;
  }
  .custom-eq-overlay.show{display:flex;}
  .custom-eq-modal{
    width:100%; max-width:440px; max-height:calc(100vh - 36px); overflow-y:auto;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 20px 50px -14px rgba(43,27,20,.45); padding:20px 22px 18px;
  }
  .custom-eq-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .custom-eq-head h3{margin:0; font-size:16px; font-weight:700; color:var(--ink);}
  .custom-eq-close{
    appearance:none; border:none; background:var(--paper-sunk); color:var(--ink-soft);
    width:26px; height:26px; border-radius:50%; font-size:13px; line-height:1; cursor:pointer; flex:none;
  }
  .custom-eq-hint{font-size:12px; color:var(--ink-faint); line-height:1.55; margin:8px 0 16px;}
  .custom-eq-field{margin-bottom:12px;}
  .custom-eq-field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .custom-eq-field .req{color:var(--accent); margin-left:2px;}
  .custom-eq-field input[type="text"], .custom-eq-field input[type="number"], .custom-eq-field select{
    width:100%; box-sizing:border-box; appearance:none; border:1px solid var(--line-strong);
    background:var(--paper); color:var(--ink); font:inherit; font-size:13px; padding:8px 10px;
    border-radius:7px; transition:border-color .15s ease;
  }
  .custom-eq-field input:focus, .custom-eq-field select:focus{outline:none; border-color:var(--accent);}
  .custom-eq-row{display:flex; gap:10px;}
  .custom-eq-row .custom-eq-field{flex:1; min-width:0;}
  .custom-eq-checks{display:flex; flex-wrap:wrap; gap:10px 16px;}
  .custom-eq-checks label, .custom-eq-checkfield label{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .custom-eq-checkfield{display:flex; align-items:flex-end;}
  .custom-eq-error{font-size:12px; color:var(--status-estimate); min-height:1.4em; margin:2px 0 4px;}
  .custom-eq-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
  .custom-eq-submit{background:var(--accent); border-color:var(--accent); color:#fff;}
  .custom-eq-submit:hover{border-color:var(--accent); color:#fff; filter:brightness(1.05);}

  .note{font-size:12.5px; color:var(--ink-faint); margin:14px 2px 0; line-height:1.6;}

  footer{margin-top:40px; border-top:1px solid var(--line); padding-top:20px;}
  footer h2{font-size:15px; margin:0 0 10px;}
  footer ul{margin:0; padding-left:18px; color:var(--ink-soft); font-size:13.5px; line-height:1.85;}
  footer li b{color:var(--ink);}

  .table-hint{display:none; font-size:12px; color:var(--ink-faint); margin:6px 2px 0;}

  @media (max-width:640px){
    .panel-head{flex-direction:column; align-items:flex-start;}
    table{font-size:12px;}
    thead th, tbody td{padding:8px 8px;}
    .kw-summary .ks-value{font-size:18px;}
    .table-hint{display:block;}
  }

  /* Export: PNG snapshot + print/PDF ----------------------------------------- */
  .export-tool-group{display:flex; align-items:center; gap:6px;}
  .export-tool-group .reset-btn[disabled]{opacity:.55; cursor:default; pointer-events:none;}
  .print-export-root{display:none;}
  .print-export-root h2{margin:0 0 4px; font-size:16px; font-weight:700; color:var(--ink);}
  .print-export-root .print-date{margin:0 0 14px; font-size:11.5px; color:var(--ink-faint);}
  @media print{
    @page{ size:landscape; margin:12mm; }
    body *{visibility:hidden;}
    .print-export-root, .print-export-root *{visibility:visible;}
    .print-export-root{
      display:block !important; position:absolute; left:0; top:0; width:100%;
      font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    }
