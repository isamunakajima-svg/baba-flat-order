<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明太フランス予約</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #fafafa;
    margin: 0;
    padding: 16px;
    color: #333;
  }
  /* 馬場FLATカラーのヘッダー（ロゴの青 #009DE2、クラフト紙の色 #DCBF8C） */
  .brand-head {
    background: #009DE2;
    margin: -16px -16px 20px;
    padding: 22px 16px 20px;
    text-align: center;
    color: #fff;
    border-bottom: 5px solid #DCBF8C;
  }
  .brand-head .logo { display: block; width: 150px; max-width: 46%; height: auto; margin: 0 auto 12px; }
  .brand-head h1 { font-size: 21px; margin: 0; letter-spacing: 1px; }
  .brand-head .price { display: inline-block; margin-top: 10px; padding: 4px 16px; border-radius: 999px; background: rgba(255,255,255,.95); color: #007bb5; font-size: 14px; font-weight: bold; }
  .qty-price { text-align: center; margin-top: 10px; font-size: 15px; color: #333; }
  .qty-price b { font-size: 20px; color: #007bb5; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
  select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 8px;
    background: #fff;
  }
  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .hint { font-size: 12px; color: #888; margin-bottom: 14px; }
  .hint.err { color: #c0392b; }

  /* カレンダー */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-size: 16px; font-weight: bold; }
  .cal-nav {
    width: 40px; height: 36px; border: none; border-radius: 8px;
    background: #f0f0f0; font-size: 16px; cursor: pointer; color: #333;
  }
  .cal-nav:disabled { opacity: 0.3; cursor: not-allowed; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 12px; color: #888; padding: 4px 0; }
  .cal-dow.sun { color: #d9534f; }
  .cal-dow.sat { color: #3b82c4; }
  .cal-day {
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 10px;
    background: #fff;
    font-size: 15px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    padding: 0;
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { box-shadow: inset 0 0 0 2px #cfe9d8; }
  .cal-day.selected { background: #06C755; color: #fff; }
  .cal-day.off {
    background: #eee;
    color: #b5b5b5;
    font-weight: normal;
    cursor: not-allowed;
  }
  .cal-legend { font-size: 12px; color: #888; margin-top: 10px; display: flex; gap: 14px; align-items: center; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; }
  .dot.ok { background: #fff; border: 1px solid #ccc; }
  .dot.off { background: #eee; }
  .dot.sel { background: #06C755; }

  .stock-box { margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; }
  .stock-title { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px; }
  .stock-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .stock-row .v { font-weight: bold; }
  .stock-row .v.zero { color: #c0392b; }
  .stock-row .v.closed { color: #999; font-weight: normal; }
  .shift-option {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 10px; cursor: pointer;
  }
  .shift-option.selected { border-color: #06C755; background: #f0fff4; }
  .shift-option.disabled { opacity: 0.4; cursor: not-allowed; }
  .shift-name { font-weight: bold; }
  .shift-remain { font-size: 13px; color: #888; }
  .qty-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 8px; }
  .qty-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: #06C755; color: white; font-size: 20px; cursor: pointer;
  }
  .qty-btn:disabled { background: #ccc; cursor: not-allowed; }
  .qty-value { font-size: 22px; font-weight: bold; min-width: 30px; text-align: center; }
  .qty-note { text-align: center; font-size: 12px; color: #888; }
  button.submit {
    width: 100%; padding: 14px; background: #06C755; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button.submit:disabled { background: #ccc; }
  .msg { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .msg.error { background: #ffe5e5; color: #c0392b; }
  .msg.success { background: #e5ffe9; color: #1e7e34; }
  .loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>

const MAX_PER_PERSON = 3; // 1人・1日あたりの上限（サーバー側の設定が優先されます）

let userId = null;
let selectedShift = null;
let quantity = 1;
let currentShifts = [];
let price = 410;           // 1個の値段（税込）。サーバー側の設定が優先されます
function yen(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
let rules = { noPickupDeadline: '17:00', lastPickup: '18:30', earlyLimit: '15:00', lateDeadline: '18:30' };
let myCount = 0;           // 選択中の日に、すでに予約している本数
let maxPerPerson = MAX_PER_PERSON;

let pickupDefault = '';    // 選んだ便の開始時刻（来店予定時刻の初期値）
let calendar = {};         // 'YYYY-MM-DD' -> { ok, reason }
let todayStr = '';
let lastDateStr = '';
let selectedDate = null;
let viewYear = 0;
let viewMonth = 0;         // 1〜12
let keepMsgOnce = false;   // 予約失敗のメッセージを、直後の再読み込みで消さないためのフラグ

// GETリクエストでGASを呼ぶ（CORS回避のため）
function callGAS(params) {
  const query = Object.keys(params)
    .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
    .join('&');
  return fetch(GAS_URL + '?' + query).then(function (res) { return res.json(); });
}

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    userId = profile.userId;

    // 友だち追加チェック（チャネルのリンク設定が無い環境ではエラーになるため、失敗しても続行）
    try {
      const friendship = await liff.getFriendship();
      if (!friendship.friendFlag) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        showMessage('error', 'ご予約の前に、公式アカウントの友だち追加をお願いします。');
        const btn = document.createElement('button');
        btn.textContent = '友だち追加する';
        btn.className = 'submit';
        btn.onclick = function () {
          liff.openWindow({ url: 'https://line.me/R/ti/p/@493rwgms', external: false });
        };
        document.getElementById('msgArea').appendChild(btn);
        return;
      }
    } catch (fe) {
      // getFriendshipが使えない場合はそのまま続行
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    document.getElementById('calPrev').addEventListener('click', function () { moveMonth(-1); });
    document.getElementById('calNext').addEventListener('click', function () { moveMonth(1); });
    document.getElementById('qtyMinus').addEventListener('click', function () { changeQty(-1); });
    document.getElementById('qtyPlus').addEventListener('click', function () { changeQty(1); });
    document.getElementById('submitBtn').addEventListener('click', submitReservation);
    setupPhoneInput();
    loadSavedCustomer();

    await loadCalendar();
  } catch (e) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').textContent = '読み込みに失敗しました。LINEアプリから開き直してください。';
  }
}

/* ---------------- カレンダー ---------------- */

async function loadCalendar() {
  try {
    const data = await callGAS({ action: 'getCalendar', userId: userId });
    if (!data.success) throw new Error(data.error || 'calendar');

    todayStr = data.today;
    lastDateStr = data.lastDate;
    document.getElementById('openNotice').textContent = data.openNotice ? '※' + data.openNotice : '';
    maxPerPerson = data.maxPerPerson || MAX_PER_PERSON;
    calendar = {};
    data.days.forEach(function (d) { calendar[d.date] = d; });

    // 最初に予約できる日を選んでおく
    let first = null;
    for (let i = 0; i < data.days.length; i++) {
      if (data.days[i].ok) { first = data.days[i].date; break; }
    }
    if (!selectedDate || !(calendar[selectedDate] && calendar[selectedDate].ok)) {
      selectedDate = first;
    }

    const base = selectedDate || todayStr;
    viewYear = Number(base.slice(0, 4));
    viewMonth = Number(base.slice(5, 7));
    renderCalendar();

    if (selectedDate) {
      loadAvailability(selectedDate);
    } else {
      document.getElementById('shiftCard').style.display = 'none';
      document.getElementById('qtyCard').style.display = 'none';
      showMessage('error', '現在、予約できる日がありません。');
    }
  } catch (e) {
    showMessage('error', 'カレンダーの取得に失敗しました。LINEアプリから開き直してください。');
  }
}

function pad2(n) { return String(n).padStart(2, '0'); }
function toDateStr(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }

function monthKey(y, m) { return y * 12 + (m - 1); }

function moveMonth(delta) {
  let m = viewMonth + delta;
  let y = viewYear;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  const minKey = monthKey(Number(todayStr.slice(0, 4)), Number(todayStr.slice(5, 7)));
  const maxKey = monthKey(Number(lastDateStr.slice(0, 4)), Number(lastDateStr.slice(5, 7)));
  if (monthKey(y, m) < minKey || monthKey(y, m) > maxKey) return;
  viewYear = y;
  viewMonth = m;
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('calTitle').textContent = viewYear + '年' + viewMonth + '月';

  const minKey = monthKey(Number(todayStr.slice(0, 4)), Number(todayStr.slice(5, 7)));
  const maxKey = monthKey(Number(lastDateStr.slice(0, 4)), Number(lastDateStr.slice(5, 7)));
  document.getElementById('calPrev').disabled = monthKey(viewYear, viewMonth) <= minKey;
  document.getElementById('calNext').disabled = monthKey(viewYear, viewMonth) >= maxKey;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const dows = ['日', '月', '火', '水', '木', '金', '土'];
  dows.forEach(function (w, i) {
    const el = document.createElement('div');
    el.className = 'cal-dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
    el.textContent = w;
    grid.appendChild(el);
  });

  const firstDow = new Date(Date.UTC(viewYear, viewMonth - 1, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(viewYear, viewMonth, 0)).getUTCDate();

  for (let i = 0; i < firstDow; i++) {
    const blank = document.createElement('button');
    blank.className = 'cal-day empty';
    blank.disabled = true;
    grid.appendChild(blank);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = toDateStr(viewYear, viewMonth, d);
    const info = calendar[ds];
    const ok = !!(info && info.ok);

    const btn = document.createElement('button');
    btn.textContent = d;
    let cls = 'cal-day';
    if (!ok) cls += ' off';
    if (ds === todayStr) cls += ' today';
    if (ds === selectedDate) cls += ' selected';
    btn.className = cls;

    if (ok) {
      btn.addEventListener('click', function () { selectDate(ds); });
    } else {
      btn.disabled = true;
    }
    grid.appendChild(btn);
  }
}

function formatDateJp(s) {
  const y = Number(s.slice(0, 4)), m = Number(s.slice(5, 7)), d = Number(s.slice(8, 10));
  const w = ['日', '月', '火', '水', '木', '金', '土'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return m + '月' + d + '日（' + w + '）';
}

function selectDate(ds) {
  selectedDate = ds;
  document.getElementById('msgArea').innerHTML = '';
  renderCalendar();
  loadAvailability(ds);
}

/* ---------------- 便・個数 ---------------- */

async function loadAvailability(dateStr) {
  document.getElementById('shiftCard').style.display = 'none';
  document.getElementById('qtyCard').style.display = 'none';
  document.getElementById('pickupCard').style.display = 'none';
  selectedShift = null;
  document.getElementById('stockBox').style.display = 'none';
  document.getElementById('dateNote').textContent = '選択中：' + formatDateJp(dateStr);

  try {
    const data = await callGAS({ action: 'getAvailability', date: dateStr, userId: userId });
    if (dateStr !== selectedDate) return; // 読み込み中に別の日が選ばれた場合は無視
    currentShifts = data.shifts || [];
    myCount = Number(data.myCount || 0);
    maxPerPerson = Number(data.maxPerPerson || MAX_PER_PERSON);
    if (data.rules) rules = data.rules;
    if (data.price) {
      price = data.price;
      document.getElementById('headPrice').textContent = yen(price);
    }
    renderShifts();
  } catch (e) {
    showMessage('error', '在庫情報の取得に失敗しました');
  }
}

function remainingForMe() {
  return Math.max(0, maxPerPerson - myCount);
}

function renderShifts() {
  const list = document.getElementById('shiftList');
  list.innerHTML = '';
  const limitReached = remainingForMe() <= 0;

  currentShifts.forEach(function (s) {
    const disabled = s.closed || limitReached;
    const div = document.createElement('div');
    div.className = 'shift-option' + (disabled ? ' disabled' : '');
    div.innerHTML =
      '<div>' +
        '<div class="shift-name">' + s.name + '（' + formatTime(s.startTime) + '〜）</div>' +
        '<div class="shift-remain">' + remainText(s) + '</div>' +
      '</div>';
    if (!disabled) {
      div.addEventListener('click', function () { selectShift(s, div); });
    }
    list.appendChild(div);
  });
  document.getElementById('shiftCard').style.display = 'block';
  renderStockSummary();

  if (keepMsgOnce) { keepMsgOnce = false; return; }

  if (limitReached) {
    showMessage('error', 'この日は1人様' + maxPerPerson + '本までです。すでに' + myCount + '本ご予約済みのため、これ以上ご予約いただけません。');
  } else if (myCount > 0) {
    showMessage('success', 'この日はすでに' + myCount + '本ご予約済みです。あと' + remainingForMe() + '本までご予約いただけます。');
  } else {
    document.getElementById('msgArea').innerHTML = '';
  }
}

// 便ごとの残り本数の表示文字
function remainText(s) {
  if (s.remaining <= 0) return '完売';
  if (s.closed) return '受付終了（残り ' + s.remaining + '個）';
  return '残り ' + s.remaining + '個';
}

// カレンダーの下に、選んだ日の各便の残り本数を表示する
function renderStockSummary() {
  document.getElementById('stockTitle').textContent = formatDateJp(selectedDate) + ' の残り本数';
  const rows = document.getElementById('stockRows');
  rows.innerHTML = '';
  currentShifts.forEach(function (s) {
    const row = document.createElement('div');
    row.className = 'stock-row';
    const left = document.createElement('span');
    left.textContent = s.name + '（' + formatTime(s.startTime) + '〜）';
    const right = document.createElement('span');
    right.className = 'v' + (s.remaining <= 0 ? ' zero' : (s.closed ? ' closed' : ''));
    right.textContent = remainText(s);
    row.appendChild(left);
    row.appendChild(right);
    rows.appendChild(row);
  });
  document.getElementById('stockBox').style.display = 'block';
}

function formatTime(t) {
  if (typeof t === 'string') return t;
  const d = new Date(t);
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}

function maxQty() {
  const stockMax = selectedShift ? selectedShift.remaining : 1;
  return Math.max(1, Math.min(stockMax, remainingForMe()));
}

function selectShift(s, el) {
  selectedShift = s;
  document.querySelectorAll('.shift-option').forEach(function (o) { o.classList.remove('selected'); });
  el.classList.add('selected');
  quantity = 1;
  updateQtyView();
  document.getElementById('qtyCard').style.display = 'block';
  buildPickupOptions(s);
}

// 来店予定時刻の選択肢を、選んだ便の開始時刻から作る
function buildPickupOptions(s) {
  const sel = document.getElementById('pickupSelect');
  sel.innerHTML = '';
  pickupDefault = (s.pickupOptions || [])[0] || '';      // 先頭 = その便の開始時刻
  (s.pickupOptions || []).forEach(function (t) {
    const o = document.createElement('option');
    o.value = t;
    o.textContent = t + ' ごろ' + (t === pickupDefault ? '（便の開始時刻）' : '');
    sel.appendChild(o);
  });
  const none = document.createElement('option');
  none.value = '';
  none.textContent = '指定なし（' + rules.noPickupDeadline + 'までにお越しください）';
  sel.appendChild(none);
  sel.value = pickupDefault;                              // 初期値は、その便の開始時刻
  document.getElementById('pickupCard').style.display = 'block';
  updatePickupHint();
  sel.onchange = updatePickupHint;
}

// 選んだ時刻に応じて、受け取り期限の案内を出す
function updatePickupHint() {
  const v = document.getElementById('pickupSelect').value;
  const hint = document.getElementById('pickupHint');
  let limit;
  if (!v) {
    limit = rules.noPickupDeadline;
  } else {
    limit = toMin(v) <= toMin(rules.earlyLimit) ? rules.noPickupDeadline : rules.lateDeadline;
  }
  hint.textContent =
    (v && v === pickupDefault ? 'ご予約の便の開始時刻（' + v + '）が入っています。遅れて来店される場合は、時刻を変更してください。' : '') +
    '受け取り期限は ' + limit + ' までです。期限を過ぎると自動でキャンセルとなり、商品は店頭で販売します。' +
    '来店予定時刻は、予定の時刻より前なら「予約確認」から変更できます。';
}

function toMin(t) {
  const p = t.split(':');
  return Number(p[0]) * 60 + Number(p[1]);
}

function changeQty(delta) {
  quantity = Math.min(maxQty(), Math.max(1, quantity + delta));
  updateQtyView();
}

function updateQtyView() {
  document.getElementById('qtyValue').textContent = quantity;
  document.getElementById('qtyMinus').disabled = quantity <= 1;
  document.getElementById('qtyPlus').disabled = quantity >= maxQty();
  document.getElementById('qtyPrice').innerHTML =
    '1個 ' + yen(price) + '円 × ' + quantity + '個 ＝ 合計 <b>' + yen(price * quantity) + '円</b>（税込）';
  document.getElementById('qtyNote').textContent =
    '1人様、同じ日に全便合わせて' + maxPerPerson + '本までです（この日はあと' + remainingForMe() + '本）';
}

/* ---------------- 名前・電話番号の保存（この端末のみ） ---------------- */

const SAVE_KEY = 'mentaiCustomer';

function loadSavedCustomer() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.name) document.getElementById('nameInput').value = saved.name;
    if (saved.phone) {
      const phoneEl = document.getElementById('phoneInput');
      phoneEl.value = cleanPhone(saved.phone);
      phoneEl.dispatchEvent(new Event('input'));
    }
  } catch (e) {
    // 保存データが読めない場合は何もしない
  }
}

function saveCustomer(name, phone) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ name: name, phone: phone }));
  } catch (e) {
    // 保存できない環境では何もしない
  }
}

/* ---------------- 電話番号 ---------------- */

function toHalfWidth(str) {
  return str.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
}

// 数字だけを残し、最大11桁までにする
function cleanPhone(v) {
  return toHalfWidth(v).replace(/[^0-9]/g, '').slice(0, 11);
}

function isValidPhone(p) {
  return /^0[5789]0\d{8}$/.test(p) || /^0(?![5789]0)[1-9]\d{8}$/.test(p);
}

function setupPhoneInput() {
  const input = document.getElementById('phoneInput');
  const hint = document.getElementById('phoneHint');
  input.addEventListener('input', function () {
    const cleaned = cleanPhone(input.value);
    if (input.value !== cleaned) input.value = cleaned;
    if (cleaned.length === 0) {
      hint.className = 'hint';
      hint.textContent = 'ハイフンなしの数字で入力してください（携帯は11桁、固定電話は10桁）';
    } else if (isValidPhone(cleaned)) {
      hint.className = 'hint';
      hint.textContent = '✓ 電話番号の形式は正しいです';
    } else {
      hint.className = 'hint err';
      hint.textContent = '電話番号が正しくありません（携帯は 090/080/070/050 から始まる11桁、固定電話は 0 から始まる10桁）';
    }
  });
}

/* ---------------- 予約送信 ---------------- */

function showMessage(type, text) {
  document.getElementById('msgArea').innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
}

async function submitReservation() {
  const name = document.getElementById('nameInput').value.trim();
  const phone = cleanPhone(document.getElementById('phoneInput').value);

  if (!selectedDate) { showMessage('error', '受け取り日を選択してください'); return; }
  if (!selectedShift) { showMessage('error', '受け取り便を選択してください'); return; }
  if (!name) { showMessage('error', 'お名前を入力してください'); return; }
  if (!phone) { showMessage('error', '電話番号を入力してください'); return; }
  if (!isValidPhone(phone)) {
    showMessage('error', '電話番号が正しくありません。ハイフンなしの数字で入力してください（携帯は11桁、固定電話は10桁）。');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '送信中...';

  try {
    const data = await callGAS({
      action: 'reserve',
      userId: userId,
      name: name,
      phone: phone,
      date: selectedDate,
      shift: selectedShift.name,
      quantity: quantity,
      pickupTime: document.getElementById('pickupSelect').value
    });

    if (data.success) {
      saveCustomer(name, phone);
      showMessage('success', 'ご予約が完了しました！LINEに確認メッセージが届きます。');
      setTimeout(function () { liff.closeWindow(); }, 2500);
    } else {
      showMessage('error', data.error || '予約に失敗しました');
      btn.disabled = false;
      btn.textContent = 'この内容で予約する';
      // 在庫やカレンダーの状態が変わっている可能性があるので読み直す（エラー表示は残す）
      keepMsgOnce = true;
      loadCalendar();
    }
  } catch (e) {
    showMessage('error', '通信エラーが発生しました');
    btn.disabled = false;
    btn.textContent = 'この内容で予約する';
  }
}

main();
</script>
