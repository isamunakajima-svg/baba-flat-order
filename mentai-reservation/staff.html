<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="受け渡し">
<meta name="robots" content="noindex, nofollow">
<title>明太フランス 受け渡し</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f3f1ec;
    color: #222;
    font-size: 18px;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ログイン */
  #login { max-width: 420px; margin: 80px auto; padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.08); text-align: center; }
  #login h1 { font-size: 24px; margin: 0 0 6px; }
  #login p { color: #777; font-size: 15px; margin: 0 0 18px; }
  #pinInput { width: 100%; font-size: 32px; letter-spacing: 8px; text-align: center; padding: 12px; border: 2px solid #ddd; border-radius: 12px; -webkit-user-select: text; user-select: text; }
  #loginBtn { width: 100%; margin-top: 14px; padding: 16px; font-size: 20px; font-weight: bold; border: none; border-radius: 12px; background: #1f8f4e; color: #fff; }
  #loginErr { color: #c0392b; font-size: 15px; min-height: 22px; margin-top: 10px; }
  .remember { margin-top: 10px; font-size: 15px; color: #666; }

  /* ヘッダー */
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd; padding: 12px 18px; }
  .row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title { font-size: 20px; font-weight: bold; margin-right: auto; }
  .nav-btn { min-width: 52px; height: 48px; border: 1px solid #ccc; background: #fff; border-radius: 10px; font-size: 18px; }
  .nav-btn:disabled { opacity: .35; }
  .nav-btn:active { background: #e3e3df; }
  .cal-wrap { position: relative; display: inline-block; }
  .cal-wrap .nav-btn { height: 48px; }
  .cal-wrap input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  button, .nav-btn, .card, input, label { touch-action: manipulation; }
  .date-label { font-size: 21px; font-weight: bold; min-width: 170px; text-align: center; }
  .row2 { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  #search { flex: 1; min-width: 200px; height: 48px; font-size: 18px; padding: 0 14px; border: 1px solid #ccc; border-radius: 10px; -webkit-user-select: text; user-select: text; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .chk input { width: 22px; height: 22px; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .pill { padding: 6px 14px; border-radius: 999px; background: #eef5ef; font-size: 16px; font-weight: bold; color: #1f6f3d; }
  .pill.wait { background: #fff1d6; color: #9a5b00; }
  .pill.view { background: #e8eef8; color: #2d5aa0; }
  .updated { font-size: 13px; color: #888; margin-left: auto; align-self: center; }

  /* 一覧 */
  main { padding: 14px 18px 60px; }
  .shift-title { font-size: 20px; font-weight: bold; margin: 18px 0 10px; display: flex; align-items: baseline; gap: 10px; }
  .shift-title small { font-size: 15px; color: #777; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 5px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 10px; border-left: 8px solid #f0a500; }
  .card.done { background: #ecece8; border-left-color: #b9b9b3; color: #888; box-shadow: none; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rep { display: inline-block; margin-left: 10px; padding: 3px 10px; border-radius: 999px; background: #e8f0ff; color: #1a4fb4; font-size: 15px; font-weight: bold; vertical-align: 4px; white-space: nowrap; }
  .card.done .rep { background: #ececec; color: #888; }
  .name { font-size: 28px; font-weight: bold; line-height: 1.2; word-break: break-all; }
  .name small { font-size: 18px; font-weight: normal; margin-left: 4px; }
  .qty { flex: none; min-width: 84px; text-align: center; background: #222; color: #fff; border-radius: 14px; padding: 6px 12px; }
  .qty b { font-size: 36px; line-height: 1; }
  .qty span { font-size: 16px; margin-left: 2px; }
  .card.done .qty { background: #aaa; }
  .meta { font-size: 16px; color: #666; line-height: 1.6; }
  .meta .pk { color: #b35c00; font-weight: bold; }
  .card.done .meta .pk { color: #888; }
  .id { font-size: 12px; color: #aaa; }
  .go { width: 100%; height: 64px; border: none; border-radius: 14px; background: #1f8f4e; color: #fff; font-size: 22px; font-weight: bold; }
  .go:active { background: #176f3c; }
  .cancel-btn { width: 100%; height: 46px; margin-top: 22px; border: 2px solid #d9a1a1; border-radius: 12px; background: #fff; color: #b03a3a; font-size: 16px; font-weight: bold; }
  .undo { width: 100%; height: 52px; border: 2px solid #aaa; border-radius: 12px; background: #fff; color: #666; font-size: 17px; }
  .done-label { font-size: 18px; font-weight: bold; color: #1f8f4e; }
  .note-box { background: #fff4c9; border: 2px solid #f0c040; border-radius: 12px; padding: 10px 12px; font-size: 18px; line-height: 1.5; color: #4a3a00; word-break: break-all; -webkit-user-select: text; user-select: text; }
  .note-box b { display: inline-block; font-size: 13px; background: #f0a500; color: #fff; border-radius: 6px; padding: 1px 8px; margin-right: 8px; vertical-align: 2px; }
  .card.done .note-box { background: #f1eede; border-color: #d8d2b0; color: #7a7455; }
  .note-btn { width: 100%; height: 48px; border: 2px dashed #c9a53a; border-radius: 12px; background: #fffdf2; color: #8a6a00; font-size: 17px; font-weight: bold; }
  .dialog textarea { width: 100%; height: 130px; font-size: 20px; font-weight: normal; padding: 10px 12px; border: 2px solid #ccc; border-radius: 12px; font-family: inherit; resize: none; -webkit-user-select: text; user-select: text; }
  .dialog .cnt { font-size: 14px; color: #888; font-weight: normal; text-align: right; margin-top: 4px; }
  .viewonly { font-size: 14px; color: #888; text-align: center; padding: 6px 0; }
  .empty { text-align: center; color: #888; padding: 60px 0; font-size: 20px; }

  /* 確認ダイアログ */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  #overlay.show { display: flex; }
  .dialog { background: #fff; border-radius: 20px; padding: 26px; width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .dialog h2 { margin: 0 0 8px; font-size: 22px; }
  .dialog .body { font-size: 24px; line-height: 1.5; margin-bottom: 20px; font-weight: bold; }

  /* ---------- コンパクト表示（1行1予約）と便タブ ---------- */
  .tabs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
  .tab { flex: none; min-width: 96px; height: 56px; padding: 0 16px; border: 2px solid #ccc; border-radius: 12px; background: #fff; color: #444; font-size: 18px; font-weight: bold; line-height: 1.15; }
  .tab small { display: block; font-size: 13px; font-weight: normal; color: #777; }
  .tab.on { background: #222; border-color: #222; color: #fff; }
  .tab.on small { color: #ddd; }
  .tab.zero:not(.on) { opacity: .55; }
  .mode-btn { height: 48px; padding: 0 14px; border: 1px solid #ccc; background: #fff; border-radius: 10px; font-size: 16px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); border-left: 8px solid #f0a500; }
  .row.done { background: #ecece8; border-left-color: #b9b9b3; color: #888; box-shadow: none; }

  .r-name .rep { margin-left: 8px; font-size: 13px; padding: 2px 8px; vertical-align: 3px; }
  .r-memo { margin-left: 6px; font-size: 18px; vertical-align: 1px; }
  .r-qty { text-align: center; background: #222; color: #fff; border-radius: 12px; padding: 4px 8px; }
  .r-qty b { font-size: 30px; line-height: 1.1; }
  .r-qty span { font-size: 14px; margin-left: 2px; }
  .row.done .r-qty { background: #aaa; }
  .r-act .go { height: 56px; font-size: 19px; }
  .r-act .undo { height: 48px; font-size: 15px; }
  .r-act .doneat { font-size: 13px; color: #1f8f4e; font-weight: bold; text-align: center; margin-bottom: 3px; }
  .r-note { margin: 0 12px 8px; padding: 6px 10px; background: #fff4c9; border: 2px solid #f0c040; border-radius: 10px; font-size: 17px; line-height: 1.4; color: #4a3a00; word-break: break-all; -webkit-user-select: text; user-select: text; }

  .r-detail { display: none; padding: 4px 14px 14px; border-top: 1px dashed #ddd; margin: 0 4px; }

  .row.open .r-main { background: #fafaf7; border-radius: 12px 12px 0 0; }
  .r-detail .cancel-btn { margin-top: 4px; }


  .tab.hold { border-color: #c9a53a; }
  .tab.hold.on { background: #8a6a00; border-color: #8a6a00; }
  .row.hold { border-left-color: #8a6a00; }
  .row.hold .r-main { grid-template-columns: 78px 1fr 150px; }
  .row.hold .r-time { color: #8a6a00; }
  .row.hold .r-name .hb { margin-left: 8px; font-size: 13px; padding: 2px 8px; border-radius: 8px; background: #8a6a00; color: #fff; font-weight: bold; vertical-align: 3px; }
  .dialog .fld { display: block; margin-top: 12px; font-size: 15px; font-weight: bold; color: #555; }
  .dialog .fld input { display: block; width: 100%; margin-top: 4px; height: 52px; font-size: 20px; font-weight: normal; padding: 0 12px; border: 2px solid #ccc; border-radius: 12px; font-family: inherit; -webkit-user-select: text; user-select: text; }
  .dialog .fld textarea { margin-top: 4px; height: 100px; }
  .tab.cx { border-color: #d9a1a1; }
  .tab.cx.on { background: #b03a3a; border-color: #b03a3a; }
  .row.cx { background: #fbf1f1; border-left-color: #d9a1a1; color: #777; }
  .row.cx .r-time { color: #b03a3a; font-size: 15px; }
  .row.cx .cxn { text-decoration: line-through; text-decoration-color: #c99; }
  .row.cx .r-qty { background: #bbb; }
  .row.cx .r-act .go { background: #fff; color: #1f6f3d; border: 2px solid #1f8f4e; font-size: 17px; }
  .cx-sub { font-size: 14px; color: #888; font-weight: normal; margin-left: 8px; }

  /* ---------- 休業日カレンダー ---------- */
  #holOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 90; padding: 16px; }
  #holOverlay.show { display: flex; }
  .holbox { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 560px; max-height: 96vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .holbox h2 { margin: 0 0 4px; font-size: 22px; }
  .holbox .hsub { font-size: 14px; color: #777; margin-bottom: 10px; line-height: 1.5; }
  .holnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .holnav .ym { font-size: 22px; font-weight: bold; }
  .holgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .holgrid .dow { text-align: center; font-size: 14px; color: #888; padding: 2px 0; }
  .holgrid button { height: 64px; border: 1px solid #ccc; background: #fff; border-radius: 10px; font-size: 20px; font-weight: bold; line-height: 1.15; padding: 0; }
  .holgrid button small { display: block; font-size: 12px; font-weight: normal; }
  .holgrid button.empty { border: none; background: transparent; }
  .holgrid button.closed { background: #9a9a9a; border-color: #9a9a9a; color: #fff; }

  .holclose { width: 100%; height: 56px; margin-top: 14px; border: none; border-radius: 14px; background: #e6e6e6; color: #444; font-size: 20px; font-weight: bold; }

  /* ---------- 印刷（A4縦） ---------- */
  #printArea { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    html, body { background: #fff !important; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; color: #000; font-size: 11pt; -webkit-user-select: auto; user-select: auto; }
    #printArea h1 { font-size: 16pt; margin: 0 0 2mm; }
    #printArea .psub { font-size: 10pt; margin: 0 0 5mm; color: #333; }
    #printArea h2 { font-size: 12pt; margin: 6mm 0 1.5mm; padding-bottom: 1mm; border-bottom: 1.5pt solid #000; break-after: avoid; }
    #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #printArea tr { break-inside: avoid; }

    #printArea .sm { font-size: 8pt; color: #333; }

    #printArea td.tel { white-space: nowrap; font-size: 10pt; }

    #printArea .pnone { margin: 6mm 0; }
  }
</style>
</head>

<div id="boot" style="padding:40px;text-align:center;color:#777;font-size:18px;">読み込み中...</div>
<script>
// 何かのエラーで画面が白いままにならないよう、エラーを画面に表示する
window.addEventListener('error', function (e) {
  var b = document.getElementById('boot');
  if (b) { b.style.display = 'block'; b.style.color = '#c0392b'; b.textContent = '画面の読み込みに失敗しました：' + (e && e.message ? e.message : ''); }

<!-- 暗証番号の入力 -->
<div id="login" style="display:none;">
  <h1>受け渡し画面</h1>
  <p>店舗用の暗証番号を入力してください</p>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyo3bKfGoxZYOqFnWeqAutK36b5Lv2hlhOxhIVMVKyPvDknGUyIvis1dZntfQnl6xKosA/exec';
const PIN_KEY = 'mentaiStaffPin';
const REFRESH_MS = 30000;

let pin = '';
let viewDate = '';
let todayStr = '';
let data = null;          // 直近の一覧データ
let busy = false;         // 操作中は自動更新しない
let viewMode = 'compact'; // compact：1行1予約 ／ card：大きいカード
try { if (localStorage.getItem('staffViewMode') === 'card') viewMode = 'card'; } catch (e) {}
let shiftTab = 'auto';    // auto：今の便を自動で選ぶ ／ all：すべて ／ 便の名前
let renderedDate = '';
const openRows = {};      // 詳細を開いている予約ID
let timer = null;

function callGAS(params) {
  const query = Object.keys(params)
    .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
    .join('&');
  return fetch(GAS_URL + '?' + query).then(function (res) { return res.json(); });
}

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- 暗証番号 ---------- */

function showLogin(msg) {
  stopTimer();
  $('boot').style.display = 'none';
  $('app').style.display = 'none';
  $('login').style.display = 'block';
  $('loginErr').textContent = msg || '';
  $('pinInput').value = '';
  setTimeout(function () { $('pinInput').focus(); }, 50);
}

async function tryLogin(inputPin, remember) {
  $('loginBtn').disabled = true;
  try {
    const r = await callGAS({ action: 'staffList', pin: inputPin, date: viewDate || '' });
    if (!r.success) {
      try { localStorage.removeItem(PIN_KEY); } catch (e) {}
      showLogin(r.error || '開けませんでした');
      return;
    }
    pin = inputPin;
    if (remember) { try { localStorage.setItem(PIN_KEY, pin); } catch (e) {} }
    $('boot').style.display = 'none';
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    applyData(r);
    startTimer();
  } catch (e) {
    showLogin('通信エラーです。ネットワークを確認してください。');
  } finally {
    $('loginBtn').disabled = false;
  }
}

/* ---------- 読み込み・表示 ---------- */

const cache = {};          // 日付 → 取得済みの一覧（日付を切り替えたとき、すぐ表示するため）
const prefetching = {};
let navTimer = null;

async function load(silent) {
  const want = viewDate;
  try {
    const r = await callGAS({ action: 'staffList', pin: pin, date: want });
    if (!r.success) {
      if (r.badPin || r.locked) { showLogin(r.error); return; }
      if (!silent || want !== viewDate) toast(r.error || '読み込みに失敗しました', true);
      return;
    }
    cache[r.date] = r;
    // 読み込み中に別の日へ切り替えられていたら、この結果は画面に反映しない
    if (want === viewDate || want === '') applyData(r);
  } catch (e) {
    if (!silent) {
      toast('通信エラーです', true);
      if (!data || data.date !== viewDate) {
        $('lists').innerHTML = '<div class="empty">読み込めませんでした。「更新」を押してください</div>';
      }
    }
  }
}

function syncPicker() {
  const el = $('datePick');
  if (!el) return;
  if (todayStr) {
    el.min = addDays(todayStr, -180);
    el.max = addDays(todayStr, 120);
  }
  if (viewDate) el.value = viewDate;
}

function applyData(r) {
  data = r;
  todayStr = r.today;
  viewDate = r.date;
  cache[r.date] = r;
  syncPicker();
  render();
  prefetchNeighbors(r.date);
}

// 前後の日をあらかじめ読んでおく（▶◀を押したとき、待たずに表示できる）
function prefetchNeighbors(d) {
  [addDays(d, -1), addDays(d, 1)].forEach(function (x) {
    if (cache[x] || prefetching[x]) return;
    prefetching[x] = true;
    callGAS({ action: 'staffList', pin: pin, date: x })
      .then(function (r) { if (r && r.success) cache[r.date] = r; })
      .catch(function () {})
      .then(function () { delete prefetching[x]; });
  });
}

// 日付を切り替える：画面は先に切り替え、通信は少し待ってから1回だけ行う（連打に強い）
function goDate(d) {
  viewDate = d;
  if (d && cache[d]) {
    data = cache[d];
    todayStr = data.today;
    syncPicker();
    render();
  } else if (d) {
    syncPicker();
    $('dateLabel').textContent = dateLabel(d) + (d === todayStr ? '・今日' : '');
    $('lists').innerHTML = '<div class="empty">読み込み中...</div>';
  }
  clearTimeout(navTimer);
  const cached = !!(d && cache[d]);
  navTimer = setTimeout(function () { load(cached); }, cached ? 350 : 120);
}

function dateLabel(s) {
  const y = Number(s.slice(0, 4)), m = Number(s.slice(5, 7)), d = Number(s.slice(8, 10));
  const w = ['日', '月', '火', '水', '木', '金', '土'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return m + '月' + d + '日（' + w + '）';
}

function addDays(s, n) {
  const y = Number(s.slice(0, 4)), m = Number(s.slice(5, 7)), d = Number(s.slice(8, 10));
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(t.getUTCDate()).padStart(2, '0');
}

function fmtPhone(p) {
  if (/^0\d{10}$/.test(p)) return p.slice(0, 3) + '-' + p.slice(3, 7) + '-' + p.slice(7);
  if (/^0\d{9}$/.test(p)) return p.slice(0, 2) + '-' + p.slice(2, 6) + '-' + p.slice(6);
  return p;
}

function render() {
  if (!data) return;
  const isToday = data.date === data.today;
  $('dateLabel').textContent = dateLabel(data.date) + (isToday ? '・今日' : '');

  const keyword = $('search').value.trim();
  const hideDone = $('hideDone').checked;

  const all = data.items.filter(function (x) { return !x.cancelled; });
  const cxItems = data.items.filter(function (x) { return x.cancelled; });
  const holdsAll = data.holds || [];
  const doneN = all.filter(function (x) { return x.handedAt; }).length;
  const waitN = all.length - doneN;
  const waitQty = all.filter(function (x) { return !x.handedAt; }).reduce(function (a, x) { return a + x.qty; }, 0);
  $('summary').innerHTML =
    '<span class="pill wait">未渡し ' + waitN + '件・' + waitQty + '本</span>' +
    '<span class="pill">お渡し済み ' + doneN + '件</span>' +
    (holdsAll.length ? '<span class="pill">取り置きのみ ' + holdsAll.filter(function (x) { return !x.handedAt; }).length + '／' + holdsAll.length + '件</span>' : '') +
    (isToday ? '' : '<span class="pill view">今日以外は確認のみ（お渡しの操作はできません）</span>') +
    '<span class="updated">更新 ' + esc(data.now) + '</span>';

  if (renderedDate !== data.date) { renderedDate = data.date; shiftTab = 'auto'; }
  const keyword2 = keyword;
  const curTab = resolveTab(isToday);
  renderTabs(all, curTab, cxItems, holdsAll);
  $('modeBtn').textContent = viewMode === 'compact' ? '表示：コンパクト' : '表示：大きいカード';

  const lists = $('lists');
  lists.innerHTML = '';

  const holdsShown = holdsAll.filter(function (x) {
    if (hideDone && x.handedAt) return false;
    if (keyword2 && (String(x.name) + ' ' + String(x.note || '')).indexOf(keyword2) < 0) return false;
    return true;
  });
  const holdSection = function () {
    if (holdsShown.length === 0) return;
    const title = document.createElement('div');
    title.className = 'shift-title';
    title.innerHTML = '電話の取り置き（明太フランスなし）<small>' + holdsShown.length + '件</small>';
    lists.appendChild(title);
    const box = document.createElement('div');
    box.className = 'list';
    holdsShown.filter(function (x) { return !x.handedAt; }).concat(holdsShown.filter(function (x) { return x.handedAt; }))
      .forEach(function (x) { box.appendChild(buildHoldRow(x, isToday)); });
    lists.appendChild(box);
  };

  if (curTab === '__hold' && !keyword2) {
    if (holdsAll.length === 0) { lists.innerHTML = '<div class="empty">この日の取り置きはありません。上の「＋ 取り置き」で追加できます</div>'; return; }
    holdSection();
    return;
  }

  if (curTab === '__cx' && !keyword2) {
    if (cxItems.length === 0) { lists.innerHTML = '<div class="empty">キャンセルされた予約はありません</div>'; return; }
    data.shifts.forEach(function (sh) {
      const items = cxItems.filter(function (x) { return x.shift === sh.name; });
      if (items.length === 0) return;
      const title = document.createElement('div');
      title.className = 'shift-title';
      title.innerHTML = esc(sh.name) + '（' + esc(sh.startTime) + '〜）<small>' + items.length + '件</small>';
      lists.appendChild(title);
      const box = document.createElement('div');
      box.className = 'list';
      items.forEach(function (x) { box.appendChild(buildCancelRow(x)); });
      lists.appendChild(box);
    });
    return;
  }

  let shown = all.filter(function (x) {
    if (hideDone && x.handedAt) return false;
    if (keyword2 && (String(x.name) + ' ' + String(x.note || '')).indexOf(keyword2) < 0) return false;
    if (!keyword2 && curTab !== 'all' && curTab !== '__cx' && x.shift !== curTab) return false;   // 検索中は全部の便から探す
    return true;
  });

  if (shown.length === 0 && !((curTab === 'all' || keyword2) && holdsShown.length)) {
    lists.innerHTML = '<div class="empty">' + (all.length === 0 ? 'この日の予約はありません' : '該当する予約がありません') + '</div>';
    return;
  }
  if (curTab === 'all' || keyword2) holdSection();

  data.shifts.forEach(function (sh) {
    // 未渡しを上、お渡し済みを下に（それぞれ元の順序＝時間順のまま）
    const items = shown.filter(function (x) { return x.shift === sh.name && !x.handedAt; })
      .concat(shown.filter(function (x) { return x.shift === sh.name && x.handedAt; }));
    if (items.length === 0) return;
    const qty = items.reduce(function (a, x) { return a + x.qty; }, 0);

    if (curTab === 'all' || curTab === '__cx' || keyword2) {
      const title = document.createElement('div');
      title.className = 'shift-title';
      title.innerHTML = esc(sh.name) + '（' + esc(sh.startTime) + '〜）<small>' + items.length + '件・' + qty + '本</small>';
      lists.appendChild(title);
    }

    const box = document.createElement('div');
    box.className = viewMode === 'compact' ? 'list' : 'grid';
    items.forEach(function (x) { box.appendChild(viewMode === 'compact' ? buildRow(x, isToday) : buildCard(x, isToday)); });
    lists.appendChild(box);
  });
}

// いま表示する便（auto のときは、時間に合わせて自動で決める）
function resolveTab(isToday) {
  if (shiftTab !== 'auto') {
    if (shiftTab === 'all' || shiftTab === '__cx' || shiftTab === '__hold' || data.shifts.some(function (s) { return s.name === shiftTab; })) return shiftTab;
    shiftTab = 'auto';
  }
  if (!isToday) return 'all';
  const m = /^(\d+):(\d+)/.exec(data.now || '');
  const nowMin = m ? Number(m[1]) * 60 + Number(m[2]) : 0;
  let pick = data.shifts[0] ? data.shifts[0].name : 'all';
  data.shifts.forEach(function (s) {
    const t = /^(\d+):(\d+)/.exec(s.startTime || '');
    if (t && Number(t[1]) * 60 + Number(t[2]) - 30 <= nowMin) pick = s.name;   // 開始30分前から、その便を表示
  });
  return pick;
}

function renderTabs(all, curTab, cxItems, holdsAll) {
  const el = $('tabs');
  el.innerHTML = '';
  const mk = function (key, label, sub, zero) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (curTab === key ? ' on' : '') + (zero ? ' zero' : '');
    b.innerHTML = esc(label) + '<small>' + esc(sub) + '</small>';
    b.addEventListener('click', function () { shiftTab = key; render(); window.scrollTo(0, 0); });
    el.appendChild(b);
  };
  const wait = all.filter(function (x) { return !x.handedAt; });
  mk('all', 'すべて', '未渡し ' + wait.length + '件', wait.length === 0);
  data.shifts.forEach(function (s) {
    const w = wait.filter(function (x) { return x.shift === s.name; }).length;
    const n = all.filter(function (x) { return x.shift === s.name; }).length;
    mk(s.name, s.name + '（' + s.startTime + '）', '未渡し ' + w + '／' + n + '件', w === 0);
  });
  const hb = document.createElement('button');
  hb.type = 'button';
  const holdWait = holdsAll.filter(function (x) { return !x.handedAt; }).length;
  hb.className = 'tab hold' + (curTab === '__hold' ? ' on' : '') + (holdsAll.length === 0 ? ' zero' : '');
  hb.innerHTML = '取り置き<small>' + (holdsAll.length ? '未渡し ' + holdWait + '／' + holdsAll.length + '件' : '0件') + '</small>';
  hb.addEventListener('click', function () { shiftTab = '__hold'; render(); window.scrollTo(0, 0); });
  el.appendChild(hb);
  const cx = document.createElement('button');
  cx.type = 'button';
  cx.className = 'tab cx' + (curTab === '__cx' ? ' on' : '') + (cxItems.length === 0 ? ' zero' : '');
  cx.innerHTML = 'キャンセル済<small>' + cxItems.length + '件</small>';
  cx.addEventListener('click', function () { shiftTab = '__cx'; render(); window.scrollTo(0, 0); });
  el.appendChild(cx);
}

      (x.visit >= 2 ? '<span class="rep">🔁 ' + esc(x.visit) + '回目</span>' : '') +

  if (!done && data.date >= data.today) {

    cb.className = 'cancel-btn';
    cb.textContent = '電話でキャンセル';
    cb.addEventListener('click', function () { confirmCancel(x); });
    d.appendChild(cb);
  }
  row.appendChild(d);
  return row;
}

/* ---------- 確認ダイアログ付きの操作 ---------- */

function ask(title, bodyHtml, yesLabel, danger, onShow) {
  return new Promise(function (resolve) {
    $('dTitle').textContent = title;
    $('dBody').innerHTML = bodyHtml;
    $('dYes').textContent = yesLabel;
    $('dYes').className = 'ok' + (danger ? ' danger' : '');
    $('overlay').classList.add('show');
    if (onShow) onShow();
    busy = true;
    const close = function (v) {
      $('overlay').classList.remove('show');
      $('dYes').onclick = null;
      $('dNo').onclick = null;
      busy = false;
      resolve(v);
    };
    $('dYes').onclick = function () { close(true); };
    $('dNo').onclick = function () { close(false); };
  });
}

async function confirmHandover(x) {
  const ok = await ask(
    'お渡し済みにしますか？',
    esc(x.name) + ' 様<br>' + esc(x.qty) + ' 本' +
      '<div class="sub">' + esc(x.shift) + '　名前と本数をご確認ください</div>',
    'お渡し済みにする', false);
  if (!ok) return;
  await send(x.id, false, x.name + ' 様をお渡し済みにしました');
}

async function confirmCancel(x) {
  const ok = await ask(
    'この予約をキャンセルしますか？',
    esc(x.name) + ' 様 ' + esc(x.qty) + ' 本' +
      '<div class="sub">' + esc(x.shift) + '　お電話でキャンセルのご連絡があった予約です。<br>' +
      '在庫は元に戻り、お客さまのLINEにキャンセルのお知らせが届きます。間違えたときは「キャンセル済」タブから元に戻せます。</div>',
    'キャンセルする', true);
  if (!ok) return;
  busy = true;
  try {
    const r = await callGAS({ action: 'staffCancel', pin: pin, reservationId: x.id });
    if (r.success) {
      toast(x.name + ' 様の予約をキャンセルしました', false);
    } else {
      if (r.badPin || r.locked) { showLogin(r.error); return; }

    }

    toast('通信エラーです。もう一度お試しください', true);
  } finally {
    busy = false;
  }
  await load(true);
}

async function holdCall(params, okMsg) {
  busy = true;
  try {
    const r = await callGAS(Object.assign({ pin: pin }, params));
    if (r.success) {
      toast(okMsg, false);
    } else {
      if (r.badPin || r.locked) { showLogin(r.error); return false; }
      toast(r.error || '失敗しました', true);
      return false;
    }
  } catch (e) {
    toast('通信エラーです。もう一度お試しください', true);
    return false;
  } finally {
    busy = false;
  }
  delete cache[viewDate];
  await load(true);
  return true;
}

// 取り置きの入力ダイアログ（追加と書き直しで共通）。edit があれば書き直し
async function addHold(edit) {
  if (!data || !viewDate) return;
  if (data.date < data.today) { toast('過去の日付の取り置きは変更できません', true); return; }
  const max = data.noteMax || 200;
  let v = edit ? { name: edit.name, note: edit.note, time: edit.pickup || '', phone: edit.phone || '' } : { name: '', note: '', time: '', phone: '' };
  while (true) {
    const ok = await ask(
      edit ? '取り置きの内容を直す' : '電話の取り置きを追加',
      esc(dateLabel(data.date)) + ' の取り置き' +
        '<div class="sub">明太フランスを含まない、パンだけの取り置きを書きます。</div>' +
        '<label class="fld">お名前<input id="holdName" type="text" maxlength="30" placeholder="例：山田"></label>' +
        '<label class="fld">取り置きの内容<textarea id="holdNote" maxlength="' + max + '" placeholder="例：クロワッサン2個、食パン1斤"></textarea></label>' +
        '<label class="fld">来店予定の時間（わかれば）<input id="holdTime" type="time"></label>' +
        '<label class="fld">電話番号（わかれば）<input id="holdPhone" type="tel" inputmode="numeric" placeholder="例：09012345678"></label>',
      edit ? '保存する' : '追加する', false,
      function () {
        $('holdName').value = v.name; $('holdNote').value = v.note; $('holdTime').value = v.time; $('holdPhone').value = v.phone;
        setTimeout(function () { $(v.name ? 'holdNote' : 'holdName').focus(); }, 60);
      });
    v = { name: $('holdName').value.trim(), note: $('holdNote').value.trim(), time: $('holdTime').value, phone: $('holdPhone').value };
    if (!ok) return;
    if (!v.name || !v.note) { toast('お名前と取り置きの内容を入力してください', true); continue; }   // 入力はそのまま残して、開き直す
    const done = await holdCall(
      edit ? { action: 'staffHoldEdit', holdId: edit.id, name: v.name, note: v.note, pickup: v.time, phone: v.phone }
           : { action: 'staffHoldAdd', date: data.date, name: v.name, note: v.note, pickup: v.time, phone: v.phone },
      v.name + ' 様の取り置きを' + (edit ? '保存しました' : '追加しました'));
    if (done) { if (!edit) { shiftTab = '__hold'; } render(); return; }
    // 失敗したときも、入力を残して開き直す
  }
}

let toastTimer = null;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = isErr ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, isErr ? 5000 : 2500);
}

function startTimer() {
  stopTimer();
  timer = setInterval(function () { if (!busy && document.visibilityState === 'visible') load(true); }, REFRESH_MS);
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

document.addEventListener('visibilitychange', function () {

});


/* ---------- 印刷用（A4縦）の表を作る ---------- */
function buildPrint() {
  if (!data) return false;
  const all = data.items.filter(function (x) { return !x.cancelled; });
  const total = all.reduce(function (a, x) { return a + x.qty; }, 0);
  let h = '<h1>明太フランス 予約一覧</h1>' +
    '<div class="psub">' + esc(dateLabel(data.date)) + '　／　' + all.length + '件・' + total + '本　／　印刷 ' + esc(data.now) + '</div>';
  if (all.length === 0 && !(data.holds || []).length) {
    h += '<div class="pnone">この日の予約はありません。</div>';
  }
  data.shifts.forEach(function (sh) {
    const items = all.filter(function (x) { return x.shift === sh.name; });
    if (items.length === 0) return;
    const qty = items.reduce(function (a, x) { return a + x.qty; }, 0);
    h += '<h2>' + esc(sh.name) + '（' + esc(sh.startTime) + '〜）　' + items.length + '件・' + qty + '本</h2>' +
      '<table><colgroup><col style="width:8mm"><col style="width:23mm"><col style="width:31mm"><col style="width:11mm"><col style="width:34mm"><col style="width:24mm"><col></colgroup>' +
      '<tr><th>渡</th><th>来店予定</th><th>お名前</th><th>本数</th><th>電話番号</th><th>予約番号</th><th>メモ</th></tr>';
    items.forEach(function (x) {
      const done = !!x.handedAt;
      h += '<tr' + (done ? ' class="done"' : '') + '>' +
        '<td class="chk">' + (done ? '✓' : '□') + '</td>' +
        '<td style="white-space:nowrap">' + (x.pickup ? esc(x.pickup) + 'ごろ' : '指定なし<br><span class="sm">' + esc(data.noPickupDeadline) + 'まで</span>') + '</td>' +
        '<td class="nm">' + esc(x.name) + ' 様' + (x.visit >= 2 ? '<br><span class="sm">' + esc(x.visit) + '回目</span>' : '') + '</td>' +
        '<td class="qty">' + esc(x.qty) + '</td>' +
        '<td class="tel">' + esc(fmtPhone(x.phone)) + '</td>' +
        '<td class="sm">' + esc(x.id) + '</td>' +
        '<td>' + (x.note ? '<b>' + esc(x.note) + '</b>' : '') + (done ? (x.note ? '<br>' : '') + '<span class="sm">お渡し済 ' + esc(x.handedAt.slice(-5)) + '</span>' : '') + '</td>' +
        '</tr>';
    });
    h += '</table>';
  });
  const holds = data.holds || [];
  if (holds.length) {
    h += '<h2>電話の取り置き（明太フランスなし）　' + holds.length + '件</h2>' +
      '<table><colgroup><col style="width:8mm"><col style="width:23mm"><col style="width:31mm"><col style="width:34mm"><col></colgroup>' +
      '<tr><th>渡</th><th>来店予定</th><th>お名前</th><th>電話番号</th><th>取り置き内容</th></tr>';
    holds.forEach(function (x) {
      const done = !!x.handedAt;
      h += '<tr' + (done ? ' class="done"' : '') + '><td class="chk">' + (done ? '✓' : '□') + '</td>' +
        '<td style="white-space:nowrap">' + (x.pickup ? esc(x.pickup) + 'ごろ' : '指定なし') + '</td>' +
        '<td class="nm">' + esc(x.name) + ' 様</td><td class="tel">' + esc(fmtPhone(x.phone)) + '</td>' +
        '<td><b>' + esc(x.note) + '</b>' + (done ? '<br><span class="sm">お渡し済 ' + esc(x.handedAt.slice(-5)) + '</span>' : '') + '</td></tr>';
    });
    h += '</table>';
  }
  $('printArea').innerHTML = h;
  return true;
}

function doPrint() {
  if (!data || data.date !== viewDate) { toast('読み込み中です。表示されてから印刷してください', true); return; }
  if (!buildPrint()) { toast('先に一覧を読み込んでください', true); return; }
  window.print();
}

/* ---------- 休業日の設定 ---------- */
let holYm = '';
let holData = null;
let holPending = 0;          // 保存待ちの操作の数
const holPendingBy = {};     // 月ごとの保存待ち数
let holChain = Promise.resolve();
const holCache = {};         // 'YYYY-MM' -> 月のデータ

function holShift(ym, delta) {
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + delta;
  const d = new Date(Date.UTC(y, m, 1));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2);
}

function holFetch(ym) {
  return callGAS({ action: 'staffHolidayMonth', pin: pin, month: ym }).then(function (r) {
    if (r.success && !holPendingBy[ym]) holCache[ym] = r;
    return r;
  });
}

async function holLoad(ym) {
  holYm = ym;
  $('holYm').textContent = ym.slice(0, 4) + '年' + Number(ym.slice(5, 7)) + '月';
  if (holCache[ym]) {
    holData = holCache[ym]; holRender();      // 前に見た月はすぐ表示（裏で最新に更新）
  } else {
    holData = null;
    $('holGrid').innerHTML = '<div style="grid-column:1/8;text-align:center;color:#777;padding:30px;">読み込み中...</div>';
  }
  try {
    const r = await holFetch(ym);
    if (holYm !== ym || holPendingBy[ym]) return;
    if (!r.success) { toast(r.error || '読み込めませんでした', true); return; }
    holData = r; holRender();
    holFetch(holShift(ym, 1)).catch(function () {});   // 次の月を先読み
  } catch (e) { if (!holData) toast('通信に失敗しました', true); }
}

function holRender() {
  const r = holData;
  const g = $('holGrid');
  g.innerHTML = '';
  ['日', '月', '火', '水', '木', '金', '土'].forEach(function (w) {
    const d = document.createElement('div'); d.className = 'dow'; d.textContent = w; g.appendChild(d);
  });
  const first = new Date(Date.UTC(Number(r.month.slice(0, 4)), Number(r.month.slice(5, 7)) - 1, 1)).getUTCDay();
  for (let i = 0; i < first; i++) {
    const b = document.createElement('button'); b.className = 'empty'; b.disabled = true; g.appendChild(b);
  }
  r.days.forEach(function (x) {
    const b = document.createElement('button');
    const past = x.date < r.today;
    b.className = (x.closed ? 'closed' : '') + (past ? ' past' : '') + (x.date === r.today ? ' today' : '');
    const day = Number(x.date.slice(8));
    b.innerHTML = day + '<small>' + (x.closed ? (x.reserved ? '休業・予約' + x.reserved : '休業') : (x.reserved ? '予約' + x.reserved : '')) + '</small>';
    if (past) b.disabled = true;
    else b.addEventListener('click', function () { holToggle(x, b); });
    g.appendChild(b);
  });
}

async function holToggle(x, btnEl) {
  const toClosed = !x.closed;
  if (toClosed && x.reserved > 0) {
    $('holOverlay').classList.remove('show');
    const ok = await ask(
      Number(x.date.slice(5, 7)) + '月' + Number(x.date.slice(8)) + '日を休業にしますか？',
      'この日にはすでに ' + x.reserved + ' 件の予約があります。' +
        '<div class="sub">休業にしても、入っている予約は自動ではキャンセルされません。お客さんへの連絡・キャンセルは、予約一覧から行ってください。</div>',
      '休業にする', true);
    $('holOverlay').classList.add('show');
    if (!ok) return;
  }
  // 画面はすぐ切り替える。保存は裏で順番に行う（連続でタップしても待たされない）
  x.closed = toClosed;
  holRender();
  holPending++;
  const ym = x.date.slice(0, 7);
  holPendingBy[ym] = (holPendingBy[ym] || 0) + 1;
  holChain = holChain.then(function () {
    return callGAS({ action: 'staffSetHoliday', pin: pin, date: x.date, closed: toClosed ? '1' : '0' })
      .then(function (r) {
        if (!r.success) throw new Error(r.error || '保存できませんでした');
      });
  }).catch(function (e) {
    toast((e && e.message) || '通信に失敗しました。もう一度お試しください', true);
    delete holCache[ym];
  }).then(function () {
    holPending--;
    holPendingBy[ym]--;
    if (!holPendingBy[holYm] && holYm) {                 // 全部保存できたら、裏で最新を確認して反映
      if (holData) holCache[holYm] = holData;
      holFetch(holYm).then(function (r) {
        if (r.success && !holPendingBy[r.month] && holYm === r.month) { holData = r; holRender(); }
      }).catch(function () {});
    }
  });
}

function openHoliday() {
  const t = viewDate || todayStr || new Date().toISOString().slice(0, 10);
  $('holOverlay').classList.add('show');
  holLoad(t.slice(0, 7));
}
$('holBtn').addEventListener('click', openHoliday);
$('holClose').addEventListener('click', function () { $('holOverlay').classList.remove('show'); });
$('holPrev').addEventListener('click', function () { holLoad(holShift(holYm, -1)); });
$('holNext').addEventListener('click', function () { holLoad(holShift(holYm, 1)); });

$('search').addEventListener('input', render);
$('hideDone').addEventListener('change', render);

  try { saved = localStorage.getItem(PIN_KEY) || ''; } catch (e) {}
  if (saved) {
    tryLogin(saved, true);
  } else {
    showLogin('');
  }
