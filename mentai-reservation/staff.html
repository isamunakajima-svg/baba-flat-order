<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="受け渡し">
<meta name="robots" content="noindex, nofollow">
<title>明太フランス 受け渡し</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f3f1ec;
    color: #222;
    font-size: 18px;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ログイン */
  #login { max-width: 420px; margin: 80px auto; padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.08); text-align: center; }
  #login h1 { font-size: 24px; margin: 0 0 6px; }
  #login p { color: #777; font-size: 15px; margin: 0 0 18px; }
  #pinInput { width: 100%; font-size: 32px; letter-spacing: 8px; text-align: center; padding: 12px; border: 2px solid #ddd; border-radius: 12px; -webkit-user-select: text; user-select: text; }
  #loginBtn { width: 100%; margin-top: 14px; padding: 16px; font-size: 20px; font-weight: bold; border: none; border-radius: 12px; background: #1f8f4e; color: #fff; }
  #loginErr { color: #c0392b; font-size: 15px; min-height: 22px; margin-top: 10px; }
  .remember { margin-top: 10px; font-size: 15px; color: #666; }

  /* ヘッダー */
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd; padding: 12px 18px; }
  .row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title { font-size: 22px; font-weight: bold; margin-right: auto; }
  .nav-btn { min-width: 52px; height: 48px; border: 1px solid #ccc; background: #fff; border-radius: 10px; font-size: 18px; }
  .nav-btn:disabled { opacity: .35; }
  .nav-btn:active { background: #e3e3df; }
  .cal-wrap { position: relative; display: inline-block; }
  .cal-wrap .nav-btn { height: 48px; }
  .cal-wrap input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  button, .nav-btn, .card, input, label { touch-action: manipulation; }
  .date-label { font-size: 22px; font-weight: bold; min-width: 190px; text-align: center; }
  .row2 { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  #search { flex: 1; min-width: 200px; height: 48px; font-size: 18px; padding: 0 14px; border: 1px solid #ccc; border-radius: 10px; -webkit-user-select: text; user-select: text; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .chk input { width: 22px; height: 22px; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .pill { padding: 6px 14px; border-radius: 999px; background: #eef5ef; font-size: 16px; font-weight: bold; color: #1f6f3d; }
  .pill.wait { background: #fff1d6; color: #9a5b00; }
  .pill.view { background: #e8eef8; color: #2d5aa0; }
  .updated { font-size: 13px; color: #888; margin-left: auto; align-self: center; }

  /* 一覧 */
  main { padding: 14px 18px 60px; }
  .shift-title { font-size: 20px; font-weight: bold; margin: 18px 0 10px; display: flex; align-items: baseline; gap: 10px; }
  .shift-title small { font-size: 15px; color: #777; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 5px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 10px; border-left: 8px solid #f0a500; }
  .card.done { background: #ecece8; border-left-color: #b9b9b3; color: #888; box-shadow: none; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rep { display: inline-block; margin-left: 10px; padding: 3px 10px; border-radius: 999px; background: #e8f0ff; color: #1a4fb4; font-size: 15px; font-weight: bold; vertical-align: 4px; white-space: nowrap; }
  .card.done .rep { background: #ececec; color: #888; }
  .name { font-size: 28px; font-weight: bold; line-height: 1.2; word-break: break-all; }
  .name small { font-size: 18px; font-weight: normal; margin-left: 4px; }
  .qty { flex: none; min-width: 84px; text-align: center; background: #222; color: #fff; border-radius: 14px; padding: 6px 12px; }
  .qty b { font-size: 36px; line-height: 1; }
  .qty span { font-size: 16px; margin-left: 2px; }
  .card.done .qty { background: #aaa; }
  .meta { font-size: 16px; color: #666; line-height: 1.6; }
  .meta .pk { color: #b35c00; font-weight: bold; }
  .card.done .meta .pk { color: #888; }
  .id { font-size: 12px; color: #aaa; }
  .go { width: 100%; height: 64px; border: none; border-radius: 14px; background: #1f8f4e; color: #fff; font-size: 22px; font-weight: bold; }
  .go:active { background: #176f3c; }
  .undo { width: 100%; height: 52px; border: 2px solid #aaa; border-radius: 12px; background: #fff; color: #666; font-size: 17px; }
  .done-label { font-size: 18px; font-weight: bold; color: #1f8f4e; }
  .note-box { background: #fff4c9; border: 2px solid #f0c040; border-radius: 12px; padding: 10px 12px; font-size: 18px; line-height: 1.5; color: #4a3a00; word-break: break-all; -webkit-user-select: text; user-select: text; }
  .note-box b { display: inline-block; font-size: 13px; background: #f0a500; color: #fff; border-radius: 6px; padding: 1px 8px; margin-right: 8px; vertical-align: 2px; }
  .card.done .note-box { background: #f1eede; border-color: #d8d2b0; color: #7a7455; }
  .note-btn { width: 100%; height: 48px; border: 2px dashed #c9a53a; border-radius: 12px; background: #fffdf2; color: #8a6a00; font-size: 17px; font-weight: bold; }
  .dialog textarea { width: 100%; height: 130px; font-size: 20px; font-weight: normal; padding: 10px 12px; border: 2px solid #ccc; border-radius: 12px; font-family: inherit; resize: none; -webkit-user-select: text; user-select: text; }
  .dialog .cnt { font-size: 14px; color: #888; font-weight: normal; text-align: right; margin-top: 4px; }
  .viewonly { font-size: 14px; color: #888; text-align: center; padding: 6px 0; }
  .empty { text-align: center; color: #888; padding: 60px 0; font-size: 20px; }

  /* 確認ダイアログ */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  #overlay.show { display: flex; }
  .dialog { background: #fff; border-radius: 20px; padding: 26px; width: 100%; max-width: 480px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .dialog h2 { margin: 0 0 8px; font-size: 22px; }
  .dialog .body { font-size: 24px; line-height: 1.5; margin-bottom: 20px; font-weight: bold; }
  .dialog .sub { font-size: 15px; color: #777; font-weight: normal; margin-top: 6px; }
  .dialog .btns { display: flex; gap: 12px; }
  .dialog button { flex: 1; height: 68px; font-size: 22px; font-weight: bold; border-radius: 14px; border: none; }
  .dialog .ok { background: #1f8f4e; color: #fff; }
  .dialog .ok.danger { background: #c0392b; }
  .dialog .no { background: #e6e6e6; color: #444; }

  #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #222; color: #fff; padding: 14px 26px; border-radius: 999px; font-size: 18px; display: none; z-index: 200; max-width: 90%; text-align: center; }
  #toast.err { background: #c0392b; }

  /* ---------- 印刷（A4縦） ---------- */
  #printArea { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    html, body { background: #fff !important; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; color: #000; font-size: 11pt; -webkit-user-select: auto; user-select: auto; }
    #printArea h1 { font-size: 16pt; margin: 0 0 2mm; }
    #printArea .psub { font-size: 10pt; margin: 0 0 5mm; color: #333; }
    #printArea h2 { font-size: 12pt; margin: 6mm 0 1.5mm; padding-bottom: 1mm; border-bottom: 1.5pt solid #000; break-after: avoid; }
    #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #printArea tr { break-inside: avoid; }
    #printArea th, #printArea td { border: 0.6pt solid #666; padding: 2.2mm 1.6mm; text-align: left; vertical-align: middle; word-break: break-all; }
    #printArea th { background: #eee; font-size: 9.5pt; }
    #printArea td.chk { text-align: center; font-size: 15pt; }
    #printArea td.qty { text-align: center; font-size: 14pt; font-weight: bold; color: #000; background: none; }
    #printArea td.nm { font-size: 12pt; font-weight: bold; }
    #printArea .sm { font-size: 8pt; color: #333; }
    #printArea td.sm { font-size: 7pt; }
    #printArea td.tel { white-space: nowrap; font-size: 10pt; }
    #printArea tr.done td { color: #666; }
    #printArea .pnone { margin: 6mm 0; }
  }
</style>
</head>
<body>

<div id="boot" style="padding:40px;text-align:center;color:#777;font-size:18px;">読み込み中...</div>
<script>
// 何かのエラーで画面が白いままにならないよう、エラーを画面に表示する
window.addEventListener('error', function (e) {
  var b = document.getElementById('boot');
  if (b) { b.style.display = 'block'; b.style.color = '#c0392b'; b.textContent = '画面の読み込みに失敗しました：' + (e && e.message ? e.message : ''); }
});
</script>

<!-- 暗証番号の入力 -->
<div id="login" style="display:none;">
  <h1>受け渡し画面</h1>
  <p>店舗用の暗証番号を入力してください</p>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
  <label class="remember"><input type="checkbox" id="rememberPin" checked> このiPadに暗証番号を記憶する</label>
  <button id="loginBtn">開く</button>
  <div id="loginErr"></div>
</div>

<!-- 受け渡し画面 -->
<div id="app" style="display:none;">
  <header>
    <div class="row1">
      <div class="title">明太フランス 受け渡し</div>
      <button class="nav-btn" id="prevBtn">◀</button>
      <div class="date-label" id="dateLabel"></div>
      <button class="nav-btn" id="nextBtn">▶</button>
      <span class="cal-wrap"><button class="nav-btn" type="button" tabindex="-1" style="padding:0 14px;">📅 日付</button><input type="date" id="datePick" aria-label="日付を選ぶ"></span>
      <button class="nav-btn" id="todayBtn" style="padding:0 16px;">今日</button>
      <button class="nav-btn" id="reloadBtn" style="padding:0 16px;">更新</button>
      <button class="nav-btn" id="printBtn" style="padding:0 16px;">印刷</button>
    </div>
    <div class="row2">
      <input id="search" type="search" placeholder="お名前・メモで探す">
      <label class="chk"><input type="checkbox" id="hideDone"> お渡し済みを隠す</label>
    </div>
    <div class="summary" id="summary"></div>
  </header>
  <main id="lists"></main>
</div>

<div id="overlay">
  <div class="dialog">
    <h2 id="dTitle"></h2>
    <div class="body" id="dBody"></div>
    <div class="btns">
      <button class="no" id="dNo">いいえ</button>
      <button class="ok" id="dYes">はい</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyo3bKfGoxZYOqFnWeqAutK36b5Lv2hlhOxhIVMVKyPvDknGUyIvis1dZntfQnl6xKosA/exec';
const PIN_KEY = 'mentaiStaffPin';
const REFRESH_MS = 30000;

let pin = '';
let viewDate = '';
let todayStr = '';
let data = null;          // 直近の一覧データ
let busy = false;         // 操作中は自動更新しない
let timer = null;

function callGAS(params) {
  const query = Object.keys(params)
    .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
    .join('&');
  return fetch(GAS_URL + '?' + query).then(function (res) { return res.json(); });
}

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- 暗証番号 ---------- */

function showLogin(msg) {
  stopTimer();
  $('boot').style.display = 'none';
  $('app').style.display = 'none';
  $('login').style.display = 'block';
  $('loginErr').textContent = msg || '';
  $('pinInput').value = '';
  setTimeout(function () { $('pinInput').focus(); }, 50);
}

async function tryLogin(inputPin, remember) {
  $('loginBtn').disabled = true;
  try {
    const r = await callGAS({ action: 'staffList', pin: inputPin, date: viewDate || '' });
    if (!r.success) {
      try { localStorage.removeItem(PIN_KEY); } catch (e) {}
      showLogin(r.error || '開けませんでした');
      return;
    }
    pin = inputPin;
    if (remember) { try { localStorage.setItem(PIN_KEY, pin); } catch (e) {} }
    $('boot').style.display = 'none';
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    applyData(r);
    startTimer();
  } catch (e) {
    showLogin('通信エラーです。ネットワークを確認してください。');
  } finally {
    $('loginBtn').disabled = false;
  }
}

/* ---------- 読み込み・表示 ---------- */

const cache = {};          // 日付 → 取得済みの一覧（日付を切り替えたとき、すぐ表示するため）
const prefetching = {};
let navTimer = null;

async function load(silent) {
  const want = viewDate;
  try {
    const r = await callGAS({ action: 'staffList', pin: pin, date: want });
    if (!r.success) {
      if (r.badPin || r.locked) { showLogin(r.error); return; }
      if (!silent || want !== viewDate) toast(r.error || '読み込みに失敗しました', true);
      return;
    }
    cache[r.date] = r;
    // 読み込み中に別の日へ切り替えられていたら、この結果は画面に反映しない
    if (want === viewDate || want === '') applyData(r);
  } catch (e) {
    if (!silent) {
      toast('通信エラーです', true);
      if (!data || data.date !== viewDate) {
        $('lists').innerHTML = '<div class="empty">読み込めませんでした。「更新」を押してください</div>';
      }
    }
  }
}

function syncPicker() {
  const el = $('datePick');
  if (!el) return;
  if (todayStr) {
    el.min = addDays(todayStr, -180);
    el.max = addDays(todayStr, 120);
  }
  if (viewDate) el.value = viewDate;
}

function applyData(r) {
  data = r;
  todayStr = r.today;
  viewDate = r.date;
  cache[r.date] = r;
  syncPicker();
  render();
  prefetchNeighbors(r.date);
}

// 前後の日をあらかじめ読んでおく（▶◀を押したとき、待たずに表示できる）
function prefetchNeighbors(d) {
  [addDays(d, -1), addDays(d, 1)].forEach(function (x) {
    if (cache[x] || prefetching[x]) return;
    prefetching[x] = true;
    callGAS({ action: 'staffList', pin: pin, date: x })
      .then(function (r) { if (r && r.success) cache[r.date] = r; })
      .catch(function () {})
      .then(function () { delete prefetching[x]; });
  });
}

// 日付を切り替える：画面は先に切り替え、通信は少し待ってから1回だけ行う（連打に強い）
function goDate(d) {
  viewDate = d;
  if (d && cache[d]) {
    data = cache[d];
    todayStr = data.today;
    syncPicker();
    render();
  } else if (d) {
    syncPicker();
    $('dateLabel').textContent = dateLabel(d) + (d === todayStr ? '・今日' : '');
    $('lists').innerHTML = '<div class="empty">読み込み中...</div>';
  }
  clearTimeout(navTimer);
  const cached = !!(d && cache[d]);
  navTimer = setTimeout(function () { load(cached); }, cached ? 350 : 120);
}

function dateLabel(s) {
  const y = Number(s.slice(0, 4)), m = Number(s.slice(5, 7)), d = Number(s.slice(8, 10));
  const w = ['日', '月', '火', '水', '木', '金', '土'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return m + '月' + d + '日（' + w + '）';
}

function addDays(s, n) {
  const y = Number(s.slice(0, 4)), m = Number(s.slice(5, 7)), d = Number(s.slice(8, 10));
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(t.getUTCDate()).padStart(2, '0');
}

function fmtPhone(p) {
  if (/^0\d{10}$/.test(p)) return p.slice(0, 3) + '-' + p.slice(3, 7) + '-' + p.slice(7);
  if (/^0\d{9}$/.test(p)) return p.slice(0, 2) + '-' + p.slice(2, 6) + '-' + p.slice(6);
  return p;
}

function render() {
  if (!data) return;
  const isToday = data.date === data.today;
  $('dateLabel').textContent = dateLabel(data.date) + (isToday ? '・今日' : '');

  const keyword = $('search').value.trim();
  const hideDone = $('hideDone').checked;

  const all = data.items;
  const doneN = all.filter(function (x) { return x.handedAt; }).length;
  const waitN = all.length - doneN;
  const waitQty = all.filter(function (x) { return !x.handedAt; }).reduce(function (a, x) { return a + x.qty; }, 0);
  $('summary').innerHTML =
    '<span class="pill wait">未渡し ' + waitN + '件・' + waitQty + '本</span>' +
    '<span class="pill">お渡し済み ' + doneN + '件</span>' +
    (isToday ? '' : '<span class="pill view">今日以外は確認のみ（お渡しの操作はできません）</span>') +
    '<span class="updated">更新 ' + esc(data.now) + '</span>';

  const lists = $('lists');
  lists.innerHTML = '';

  let shown = all.filter(function (x) {
    if (hideDone && x.handedAt) return false;
    if (keyword && (String(x.name) + ' ' + String(x.note || '')).indexOf(keyword) < 0) return false;
    return true;
  });

  if (shown.length === 0) {
    lists.innerHTML = '<div class="empty">' + (all.length === 0 ? 'この日の予約はありません' : '該当する予約がありません') + '</div>';
    return;
  }

  data.shifts.forEach(function (sh) {
    const items = shown.filter(function (x) { return x.shift === sh.name; });
    if (items.length === 0) return;
    const qty = items.reduce(function (a, x) { return a + x.qty; }, 0);

    const title = document.createElement('div');
    title.className = 'shift-title';
    title.innerHTML = esc(sh.name) + '（' + esc(sh.startTime) + '〜）<small>' + items.length + '件・' + qty + '本</small>';
    lists.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(function (x) { grid.appendChild(buildCard(x, isToday)); });
    lists.appendChild(grid);
  });
}

function buildCard(x, isToday) {
  const done = !!x.handedAt;
  const card = document.createElement('div');
  card.className = 'card' + (done ? ' done' : '');
  card.innerHTML =
    '<div class="top">' +
      '<div class="name">' + esc(x.name) + '<small>様</small>' + (x.visit >= 2 ? '<span class="rep">🔁 ' + esc(x.visit) + '回目</span>' : '') + '</div>' +
      '<div class="qty"><b>' + esc(x.qty) + '</b><span>本</span></div>' +
    '</div>' +
    '<div class="meta">' +
      (data.price ? '金額：<b>' + esc(Number(x.qty * data.price).toLocaleString('ja-JP')) + '円</b>（税込）<br>' : '') +
      '来店予定：' + (x.pickup ? '<span class="pk">' + esc(x.pickup) + ' ごろ</span>' : '指定なし（' + esc(data.noPickupDeadline) + 'まで）') + '<br>' +
      'TEL ' + esc(fmtPhone(x.phone)) +
    '</div>' +
    (x.note ? '<div class="note-box"><b>取り置き</b>' + esc(x.note) + '</div>' : '') +
    '<div class="id">' + esc(x.id) + '</div>';

  if (data.date >= data.today) {
    const nb = document.createElement('button');
    nb.className = 'note-btn';
    nb.textContent = x.note ? '✎ 取り置きメモを直す' : '＋ 取り置きメモを書く（ほかのパン）';
    nb.addEventListener('click', function () { editNote(x); });
    card.appendChild(nb);
  }

  if (done) {
    const label = document.createElement('div');
    label.className = 'done-label';
    label.textContent = '✓ お渡し済み（' + x.handedAt.slice(-5) + '）';
    card.appendChild(label);
    if (isToday) {
      const b = document.createElement('button');
      b.className = 'undo';
      b.textContent = 'お渡し済みを取り消す';
      b.addEventListener('click', function () { confirmUndo(x); });
      card.appendChild(b);
    }
  } else if (isToday) {
    const b = document.createElement('button');
    b.className = 'go';
    b.textContent = 'お渡し済み';
    b.addEventListener('click', function () { confirmHandover(x); });
    card.appendChild(b);
  } else {
    const v = document.createElement('div');
    v.className = 'viewonly';
    v.textContent = '（確認のみ）';
    card.appendChild(v);
  }
  return card;
}

/* ---------- 確認ダイアログ付きの操作 ---------- */

function ask(title, bodyHtml, yesLabel, danger, onShow) {
  return new Promise(function (resolve) {
    $('dTitle').textContent = title;
    $('dBody').innerHTML = bodyHtml;
    $('dYes').textContent = yesLabel;
    $('dYes').className = 'ok' + (danger ? ' danger' : '');
    $('overlay').classList.add('show');
    if (onShow) onShow();
    busy = true;
    const close = function (v) {
      $('overlay').classList.remove('show');
      $('dYes').onclick = null;
      $('dNo').onclick = null;
      busy = false;
      resolve(v);
    };
    $('dYes').onclick = function () { close(true); };
    $('dNo').onclick = function () { close(false); };
  });
}

async function confirmHandover(x) {
  const ok = await ask(
    'お渡し済みにしますか？',
    esc(x.name) + ' 様<br>' + esc(x.qty) + ' 本' +
      '<div class="sub">' + esc(x.shift) + '　名前と本数をご確認ください</div>',
    'お渡し済みにする', false);
  if (!ok) return;
  await send(x.id, false, x.name + ' 様をお渡し済みにしました');
}

async function confirmUndo(x) {
  const ok = await ask(
    '取り消しますか？',
    esc(x.name) + ' 様 ' + esc(x.qty) + ' 本<div class="sub">「お渡し済み」を取り消して、未渡しに戻します</div>',
    '取り消す', true);
  if (!ok) return;
  await send(x.id, true, x.name + ' 様を未渡しに戻しました');
}

async function editNote(x) {
  const max = (data && data.noteMax) || 200;
  const ok = await ask(
    '取り置きメモ',
    esc(x.name) + ' 様（' + esc(x.qty) + '本）' +
      '<div class="sub">電話で受けた、ほかのパンの取り置きを書きます。空にして保存すると消えます。</div>' +
      '<textarea id="noteInput" maxlength="' + max + '" placeholder="例：クロワッサン2個、食パン1斤"></textarea>' +
      '<div class="cnt" id="noteCnt"></div>',
    '保存する', false,
    function () {
      const t = $('noteInput');
      t.value = x.note || '';
      const upd = function () { $('noteCnt').textContent = t.value.length + ' / ' + max + '文字'; };
      t.addEventListener('input', upd);
      upd();
      setTimeout(function () { t.focus(); }, 60);
    });
  if (!ok) return;
  const text = $('noteInput').value;
  busy = true;
  try {
    const r = await callGAS({ action: 'staffNote', pin: pin, reservationId: x.id, note: text });
    if (r.success) {
      toast(r.note ? '取り置きメモを保存しました' : '取り置きメモを消しました', false);
    } else {
      if (r.badPin || r.locked) { showLogin(r.error); return; }
      toast(r.error || '保存に失敗しました', true);
    }
  } catch (e) {
    toast('通信エラーです。もう一度お試しください', true);
  } finally {
    busy = false;
  }
  await load(true);
}

async function send(id, undo, okMessage) {
  busy = true;
  try {
    const r = await callGAS({ action: 'staffHandover', pin: pin, reservationId: id, undo: undo ? '1' : '0' });
    if (r.success) {
      toast(okMessage, false);
    } else {
      if (r.badPin || r.locked) { showLogin(r.error); return; }
      toast(r.error || '失敗しました', true);
    }
  } catch (e) {
    toast('通信エラーです。もう一度お試しください', true);
  } finally {
    busy = false;
  }
  await load(true);
}

/* ---------- その他 ---------- */

let toastTimer = null;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = isErr ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, isErr ? 5000 : 2500);
}

function startTimer() {
  stopTimer();
  timer = setInterval(function () { if (!busy && document.visibilityState === 'visible') load(true); }, REFRESH_MS);
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && pin && !busy) load(true);
});


/* ---------- 印刷用（A4縦）の表を作る ---------- */
function buildPrint() {
  if (!data) return false;
  const all = data.items;
  const total = all.reduce(function (a, x) { return a + x.qty; }, 0);
  let h = '<h1>明太フランス 予約一覧</h1>' +
    '<div class="psub">' + esc(dateLabel(data.date)) + '　／　' + all.length + '件・' + total + '本　／　印刷 ' + esc(data.now) + '</div>';
  if (all.length === 0) {
    h += '<div class="pnone">この日の予約はありません。</div>';
  }
  data.shifts.forEach(function (sh) {
    const items = all.filter(function (x) { return x.shift === sh.name; });
    if (items.length === 0) return;
    const qty = items.reduce(function (a, x) { return a + x.qty; }, 0);
    h += '<h2>' + esc(sh.name) + '（' + esc(sh.startTime) + '〜）　' + items.length + '件・' + qty + '本</h2>' +
      '<table><colgroup><col style="width:8mm"><col style="width:23mm"><col style="width:31mm"><col style="width:11mm"><col style="width:34mm"><col style="width:24mm"><col></colgroup>' +
      '<tr><th>渡</th><th>来店予定</th><th>お名前</th><th>本数</th><th>電話番号</th><th>予約番号</th><th>メモ</th></tr>';
    items.forEach(function (x) {
      const done = !!x.handedAt;
      h += '<tr' + (done ? ' class="done"' : '') + '>' +
        '<td class="chk">' + (done ? '✓' : '□') + '</td>' +
        '<td style="white-space:nowrap">' + (x.pickup ? esc(x.pickup) + 'ごろ' : '指定なし<br><span class="sm">' + esc(data.noPickupDeadline) + 'まで</span>') + '</td>' +
        '<td class="nm">' + esc(x.name) + ' 様' + (x.visit >= 2 ? '<br><span class="sm">' + esc(x.visit) + '回目</span>' : '') + '</td>' +
        '<td class="qty">' + esc(x.qty) + '</td>' +
        '<td class="tel">' + esc(fmtPhone(x.phone)) + '</td>' +
        '<td class="sm">' + esc(x.id) + '</td>' +
        '<td>' + (x.note ? '<b>' + esc(x.note) + '</b>' : '') + (done ? (x.note ? '<br>' : '') + '<span class="sm">お渡し済 ' + esc(x.handedAt.slice(-5)) + '</span>' : '') + '</td>' +
        '</tr>';
    });
    h += '</table>';
  });
  $('printArea').innerHTML = h;
  return true;
}

function doPrint() {
  if (!data || data.date !== viewDate) { toast('読み込み中です。表示されてから印刷してください', true); return; }
  if (!buildPrint()) { toast('先に一覧を読み込んでください', true); return; }
  window.print();
}

$('loginBtn').addEventListener('click', function () {
  const v = $('pinInput').value.trim();
  if (!v) { $('loginErr').textContent = '暗証番号を入力してください'; return; }
  tryLogin(v, $('rememberPin').checked);
});
$('pinInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

$('prevBtn').addEventListener('click', function () { goDate(addDays(viewDate || todayStr, -1)); });
$('nextBtn').addEventListener('click', function () { goDate(addDays(viewDate || todayStr, 1)); });
$('todayBtn').addEventListener('click', function () { goDate(todayStr || ''); });
$('datePick').addEventListener('change', function () {
  const v = this.value;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v) && v !== viewDate) goDate(v);
});
$('datePick').addEventListener('click', function () {
  try { if (this.showPicker) this.showPicker(); } catch (e) {}
});
$('reloadBtn').addEventListener('click', function () { delete cache[viewDate]; clearTimeout(navTimer); load(false); });
$('printBtn').addEventListener('click', doPrint);
$('search').addEventListener('input', render);
$('hideDone').addEventListener('change', render);

(function init() {
  let saved = '';
  try { saved = localStorage.getItem(PIN_KEY) || ''; } catch (e) {}
  if (saved) {
    tryLogin(saved, true);
  } else {
    showLogin('');
  }
})();
</script>
